name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: Generator (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Example is up to date and checks cleanly
        run: cargo run --quiet -- check --project ../examples/shop

  dart:
    name: Runtime + example (Flutter)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [packages/trellis, examples/shop]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
