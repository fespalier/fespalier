name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: Generator (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Versions agree (Cargo.toml, pubspec.yaml, fsp init, READMEs, launcher)
        run: cargo test --test versions
      - name: Examples check cleanly
        run: |
          cargo run --quiet -- check --project ../examples/shop
          cargo run --quiet -- check --project ../examples/features
          cargo run --quiet -- check --project ../examples/tabs

  dart:
    name: Runtime + examples (Flutter)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [packages/fespalier, examples/shop, examples/features, examples/tabs]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Ready for pub.dev (no warnings)
        if: matrix.dir == 'packages/fespalier'
        run: flutter pub publish --dry-run

  scaffold:
    name: Scaffolded files compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold every file kind into the features example
        working-directory: examples/features
        run: |
          fsp() { cargo run --quiet --manifest-path ../../cli/Cargo.toml -- "$@"; }
          fsp new 'orders/[orderId]' --data --loading --error --layout --guard --transition
          fsp new 'shops/:shop/items/:id/reviews'
          fsp new 'plain' --data
          fsp new '(admin)/users' --layout
          flutter pub get
          flutter analyze
      - name: dart run fespalier runs the given fsp
        working-directory: examples/shop
        run: |
          cargo build --quiet --manifest-path ../../cli/Cargo.toml
          flutter pub get
          FSP_BINARY="$PWD/../../cli/target/debug/fsp" dart run fespalier --version
          FSP_BINARY="$PWD/../../cli/target/debug/fsp" dart run fespalier routes

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Compile and unit-test
        run: npm test
      - name: Package the extension
        run: npx --no-install vsce package --no-dependencies

  packaging:
    name: Homebrew and Scoop files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render from fake checksums
        run: python3 scripts/test_packaging.py
      - name: Pin fake checksums in the Dart package
        run: python3 scripts/test_pin_checksums.py
