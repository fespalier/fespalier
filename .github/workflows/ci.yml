name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter the examples and the package are built and tested with (Dart 3.13.4). Exact, so a
  # new stable release cannot turn CI red on its own; bump it here, deliberately.
  FLUTTER_VERSION: 3.47.5
  # The oldest Flutter the package declares (`flutter: ">=3.32.0"` in its pubspec, "Flutter 3.32 or
  # newer" in the READMEs): the `floor` job builds and tests on it, and `just floor` reads its minor
  # from here. Exact, like FLUTTER_VERSION: the last 3.32 patch release. cli/tests/versions.rs checks
  # that the minor still matches what the pubspecs and READMEs claim.
  FLUTTER_FLOOR_VERSION: 3.32.8
  # The oldest Flutter the `otel` feature of `fsp create` runs on (its recipe says 3.35): otel_zone
  # depends on talker_riverpod_logger, which needs Dart 3.9. The `create-floor` job makes the apps
  # with `otel` on it. Exact, like the others.
  FLUTTER_OTEL_FLOOR_VERSION: 3.35.0

jobs:
  cli:
    name: Generator (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is pinned once, in cli/rust-toolchain.toml; this reads it from there.
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The upgrade tests use the system curl; FSP_REQUIRE_CURL=1 fails them instead of skipping.
      - run: cargo test
        env:
          FSP_REQUIRE_CURL: "1"
      - name: Versions agree (Cargo.toml, pubspec.yaml, fsp init, READMEs and docs, launcher)
        run: cargo test --test versions
      - name: Examples check cleanly
        run: |
          cargo run --quiet -- check --project ../examples/shop
          cargo run --quiet -- check --project ../examples/features
          cargo run --quiet -- check --project ../examples/tabs
          cargo run --quiet -- check --project ../examples/minimal
          cargo run --quiet -- check --project ../examples/telemetry
          cargo run --quiet -- check --project ../examples/auth
          cargo run --quiet -- check --project ../examples/plugins
          cargo run --quiet -- check --project ../examples/downloads
          cargo run --quiet -- check --project ../examples/cose
          cargo run --quiet -- check --project ../examples/i18n
          cargo run --quiet -- check --project ../examples/maps
          cargo run --quiet -- check --project ../examples/adopt
          cargo run --quiet -- check --project ../examples/offline
          cargo run --quiet -- maestro --check --project ../examples/shop
      # Licences, advisories, duplicate versions, sources: cli/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: cli/Cargo.toml
          command: check

  # `fsp upgrade` replaces a running fsp.exe on Windows (rename aside, move in, roll back), the
  # release asset is a .zip, and tar is the bsdtar in System32: only a Windows runner shows it.
  # Like the `cli` job above, it is not gated by a paths filter (ci.yml has none).
  cli-windows:
    name: fsp upgrade (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # curl and tar ship with Windows 10+; FSP_REQUIRE_CURL=1 fails the tests instead of skipping.
      - name: Upgrade unit tests
        run: cargo test upgrade
        env:
          FSP_REQUIRE_CURL: "1"
      - name: Upgrade tests against a fake release server
        run: cargo test --test upgrade
        env:
          FSP_REQUIRE_CURL: "1"

  dart:
    name: Runtime + examples (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir:
          - packages/fespalier
          - packages/fespalier_devtools
          - packages/fespalier_otel
          - packages/fespalier_auth
          - packages/fespalier_sign_keypair
          - packages/fespalier_adaptive
          - packages/fespalier_flags
          - packages/fespalier_storage
          - packages/fespalier_connectivity
          - packages/fespalier_image
          - packages/fespalier_http
          - packages/fespalier_dio
          - packages/fespalier_cratestack
          - packages/fespalier_sentry
          - packages/fespalier_tolgee
          - packages/fespalier_forms
          - packages/fespalier_maps
          - packages/fespalier_download
          - packages/fespalier_download_background
          - packages/fespalier_push
          - packages/fespalier_biometrics
          - packages/fespalier_analytics
          - packages/fespalier_frb
          - packages/fespalier_riverpod
          - examples/shop
          - examples/features
          - examples/tabs
          - examples/minimal
          - examples/telemetry
          - examples/auth
          - examples/plugins
          - examples/downloads
          - examples/cose
          - examples/i18n
          - examples/maps
          - examples/adopt
          - examples/offline
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # After pub get: the formatter reads each package's language version from its package
      # config. Generated files (`*.g.dart`) are left out: fsp writes them unformatted unless
      # `format: true`, and `fsp gen` compares them byte for byte.
      - name: Formatted (dart format)
        run: >-
          find . -name '*.dart' ! -name '*.g.dart' -not -path './.dart_tool/*' -not -path './build/*'
          -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test
      # The generated files hide lints with `ignore_for_file`; the const ones are checked here,
      # on a copy without it (a page built without `const` rebuilds on every navigation).
      - name: Generated code is const-clean
        if: startsWith(matrix.dir, 'examples/')
        env:
          WORKSPACE: ${{ github.workspace }}
        run: '"$WORKSPACE/scripts/check-const-lints.sh" .'

  # The declared floor. Everything above runs on FLUTTER_VERSION, so "Flutter 3.32 or newer" was never
  # exercised: a call to an API newer than 3.32 compiled and passed here. This runs the package and
  # the companions that claim 3.32 on FLUTTER_FLOOR_VERSION with every dependency at its lowest
  # allowed version (`flutter pub downgrade`, so a constraint nobody tested fails here, as
  # `hooks_riverpod: ^3.2.1` did), then analyzes and tests them.
  # examples/minimal is the one app that goes through the same. `just floor` runs it locally.
  #
  # Left out on purpose:
  # - packages/fespalier_sign_keypair: flutter_sign_keypair needs Flutter 3.44 (Dart 3.12), so it
  #   does not resolve on 3.32 and the package declares that floor itself.
  # - packages/fespalier_download_background: background_downloader 9.6 needs Flutter 3.47 (Dart
  #   3.13), so it does not resolve on 3.32 and the package declares that floor itself.
  # - packages/fespalier_devtools: a web app, not a package; its release build is committed and
  #   compared byte for byte on FLUTTER_VERSION (the `devtools` job), and its lockfile is committed
  #   on purpose, which `pub downgrade` would rewrite.
  # - the other examples: they are not floor claims; `minimal` is the app-level check.
  floor:
    name: Floor (Flutter 3.32, lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir:
          - packages/fespalier
          - packages/fespalier_otel
          - packages/fespalier_auth
          - packages/fespalier_adaptive
          - packages/fespalier_image
          - packages/fespalier_flags
          - packages/fespalier_storage
          - packages/fespalier_connectivity
          - packages/fespalier_http
          - packages/fespalier_dio
          - packages/fespalier_cratestack
          - packages/fespalier_sentry
          - packages/fespalier_tolgee
          - packages/fespalier_forms
          - packages/fespalier_maps
          - packages/fespalier_download
          - packages/fespalier_push
          - packages/fespalier_biometrics
          - packages/fespalier_analytics
          - packages/fespalier_frb
          - packages/fespalier_riverpod
          - examples/minimal
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_FLOOR_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub downgrade
      # No `dart format` here: its output depends on the SDK, and the `dart` job checks it.
      - run: flutter analyze
      - run: flutter test

  devtools:
    name: DevTools extension (built output is current)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # packages/fespalier/extension/devtools/build is what DevTools loads, committed. This builds
      # packages/fespalier_devtools again and fails on any difference (a UI change, a changed
      # protocol file, a new Flutter), then runs `devtools_extensions validate`. To fix a failure:
      # scripts/build-devtools-extension.sh, and commit the result.
      - name: Build, compare with the committed build, validate
        run: scripts/build-devtools-extension.sh --check

  scaffold:
    name: Scaffolded files compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Scaffold every file kind into the features example
        working-directory: examples/features
        run: |
          fsp() { cargo run --quiet --manifest-path ../../cli/Cargo.toml -- "$@"; }
          fsp new 'invoices/[invoiceId]' --data --action --loading --error --layout --guard --transition --nav --leave
          fsp new 'shops/:shop/items/:id/reviews'
          fsp new 'plain' --data
          fsp new '(admin)/users' --layout
          flutter pub get
          flutter analyze
      # `fsp new` and `fsp init` write files that `dart format` leaves alone. The examples
      # declare an older language version (the formatter would pick the short style from it),
      # so the current style is asked for explicitly.
      - name: Scaffolded files are dart format clean
        working-directory: examples/features
        run: >-
          git ls-files --others --exclude-standard -z -- lib/app |
          xargs -0 dart format --language-version=latest --output=none --set-exit-if-changed
      - name: fsp init on a fresh app passes dart format and flutter analyze
        env:
          FSP_BIN: ${{ github.workspace }}/cli/target/debug/fsp
        run: |
          cargo build --quiet --manifest-path cli/Cargo.toml
          cd "$RUNNER_TEMP"
          flutter create --empty --project-name fresh_app --platforms web fresh_app
          cd fresh_app
          flutter pub add fespalier --path "$GITHUB_WORKSPACE/packages/fespalier"
          "$FSP_BIN" init
          # init writes lib/app/app.dart and, from it, the generated main() (lib/app.main.g.dart);
          # lib/main.dart is the app's own, so it is made to run that one, as init prints.
          test -f lib/app/app.dart
          test -f lib/app.main.g.dart
          # ... and a commented `tasks:` example for `fsp dev` (since 0.9.0), comments only, so the
          # `flutter analyze` below parses the same pubspec.
          grep -q '^# fsp dev reads tasks:' pubspec.yaml
          cat > lib/main.dart <<'DART'
          import 'package:fresh_app/app.main.g.dart';

          Future<void> main() => AppMain.run();
          DART
          find lib -name '*.dart' ! -name '*.g.dart' -print0 |
            xargs -0 dart format --output=none --set-exit-if-changed
          flutter analyze
      # `fespalier: adapters:` compiles with the generated main() and with `main: manual` (since
      # 0.11.0): no example has an adapter package, and a nested one would break `just flutter`'s
      # analyze, so a path package that overrides every member is made in the runner's temp folder.
      - name: Adapters compile with the generated main and with main manual
        env:
          FSP_BIN: ${{ github.workspace }}/cli/target/debug/fsp
        run: |
          cargo build --quiet --manifest-path cli/Cargo.toml
          cd "$RUNNER_TEMP"
          # A path package that overrides every member of a FespalierAdapter.
          mkdir -p demo_adapter/lib
          cat > demo_adapter/pubspec.yaml <<'YAML'
          name: demo_adapter
          publish_to: none
          environment:
            sdk: ^3.8.0
          dependencies:
            flutter:
              sdk: flutter
            fespalier:
              path: GITHUB_WORKSPACE/packages/fespalier
          YAML
          sed -i "s|GITHUB_WORKSPACE|$GITHUB_WORKSPACE|" demo_adapter/pubspec.yaml
          cat > demo_adapter/lib/fespalier_adapter.dart <<'DART'
          import 'dart:async';

          import 'package:fespalier/fespalier.dart';
          import 'package:fespalier/startup.dart';
          import 'package:flutter/widgets.dart';

          const adapter = DemoAdapter();

          class DemoAdapter extends FespalierAdapter {
            const DemoAdapter();

            @override
            Future<void> zone(Future<void> Function() body) => body();

            @override
            Future<void>? beforeRun() => null;

            @override
            List<Override> overrides() => const [];

            @override
            List<ProviderObserver> providerObservers() => const [];

            @override
            List<NavigatorObserver> routerObservers() => const [];

            @override
            Widget wrap(Widget root) => root;

            @override
            void attach(GoRouter router, ProviderContainer container) {}

            @override
            FutureOr<InboundLaunch?> launch() => null;

            @override
            FutureOr<OnEnterResult>? onEnter(InboundNavigation navigation) => null;
          }
          DART
          flutter create --empty --project-name adapter_app --platforms web adapter_app
          cd adapter_app
          flutter pub add fespalier --path "$GITHUB_WORKSPACE/packages/fespalier"
          flutter pub add demo_adapter --path ../demo_adapter
          mkdir -p lib/app
          cat > lib/app/page.dart <<'DART'
          import 'package:flutter/material.dart';

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) => const Text('home');
          }
          DART
          # 1. The generated main() calls AppAdapters.
          printf '\nfespalier:\n  adapters: [demo_adapter]\n' >> pubspec.yaml
          "$FSP_BIN" gen
          grep -q 'abstract final class AppAdapters' lib/app.g.dart
          grep -q 'attach: AppRoutes.attach' lib/app.main.g.dart
          cat > lib/main.dart <<'DART'
          import 'package:adapter_app/app.main.g.dart';

          Future<void> main() => AppMain.run();
          DART
          flutter analyze
          # 2. main: manual keeps AppAdapters, and the app's own main() calls it.
          sed -i 's|^  adapters: \[demo_adapter\]|  main: manual\n  adapters: [demo_adapter]|' pubspec.yaml
          rm lib/app.main.g.dart
          "$FSP_BIN" gen
          test ! -f lib/app.main.g.dart
          grep -q 'abstract final class AppAdapters' lib/app.g.dart
          cat > lib/main.dart <<'DART'
          import 'package:adapter_app/app.g.dart';
          import 'package:fespalier/fespalier.dart';
          import 'package:flutter/material.dart';

          Future<void> main() => AppAdapters.zone(() async {
            WidgetsFlutterBinding.ensureInitialized();
            if (AppAdapters.beforeRun() case final ready?) await ready;
            final container = ProviderContainer(
              overrides: [...AppAdapters.overrides()],
              observers: [...AppAdapters.providerObservers()],
            );
            final launch = await AppAdapters.launch();
            final router = AppRoutes.router(
              launch: launch,
              observers: [...AppAdapters.routerObservers()],
            );
            AppRoutes.attach(router, container);
            runApp(
              AppAdapters.wrap(
                UncontrolledProviderScope(
                  container: container,
                  child: MaterialApp.router(routerConfig: router),
                ),
              ),
            );
          });
          DART
          flutter analyze
      # A release build has none of fespalier's telemetry code either (since 0.8.1): the app does not
      # opt in (`fespalier: telemetry: true`), so no call site passes a `TelemetrySite`, and nothing
      # installs a sink. Its `observe.dart` is there on purpose: the lifecycle hooks share a router
      # watch with telemetry, and an app that has hooks but no telemetry must not carry any of it.
      # `fespalier telemetry` is the line the runtime prints when a sink throws, which only the
      # telemetry code can reach; with the key on, a release build has it (checked by hand when this
      # step was written), so its absence here means something.
      #
      # A release build has none of fespalier's DevTools code: `kFespalierDevTools` is false there,
      # so the service extensions, the route tree, the hooks and the `traceGuard` / `traceData` /
      # `watchData` wrappers around the guards, the data and the views are compiled away. A
      # profile build has all of it, which is what gives the greps for it a meaning. The app has
      # a guarded route with a data.dart and an action.dart, so the generated file carries every
      # wrapper, and a button that runs the action, so the build has to keep the code that traces
      # it. (`fsp init` leaves main.dart alone, so the app is given one that uses the generated
      # router.)
      - name: A release build carries no DevTools code
        env:
          FSP_BIN: ${{ github.workspace }}/cli/target/debug/fsp
        run: |
          cd "$RUNNER_TEMP/fresh_app"
          "$FSP_BIN" new 'orders/[id]' --data --action --guard --observe
          "$FSP_BIN" gen
          grep -q 'traceGuard(' lib/app.g.dart
          grep -q 'traceData(' lib/app.g.dart
          grep -q 'watchData(' lib/app.g.dart
          grep -q '_devToolsProviders' lib/app.g.dart
          grep -q "site: 'a" lib/app.g.dart
          grep -q 'observeAttach(' lib/app.g.dart
          if grep -q 'TelemetrySite' lib/app.g.dart; then
            echo "::error::an app that does not opt in got telemetry call sites"
            exit 1
          fi
          cat > lib/main.dart <<'DART'
          import 'package:fespalier/fespalier.dart';
          import 'package:flutter/material.dart';

          import 'app.g.dart';

          void main() {
            runApp(
              ProviderScope(
                child: MaterialApp.router(
                  routerConfig: AppRoutes.router(),
                  builder: (context, child) => Consumer(
                    builder: (context, ref, _) => TextButton(
                      onPressed: () => OrdersIdRoute.submit(ref, id: '1', input: 'x'),
                      child: child ?? const SizedBox(),
                    ),
                  ),
                ),
              ),
            );
          }
          DART
          flutter analyze
          flutter build web --profile --no-wasm-dry-run
          for needle in 'ext\.fespalier\.snapshot' 'ext\.fespalier\.invalidate' 'ext\.fespalier\.open' 'ext\.fespalier\.holders' 'fespalier:guard' 'fespalier:data' 'fespalier:action' 'ToolEvent' 'fespalier views' 'fespalier containers'; do
            grep -q "$needle" build/web/main.dart.js || {
              echo "::error::the profile build has no $needle, so the release check below proves nothing"
              exit 1
            }
          done
          # The profile build keeps the DevTools code but, with no sink installed, none of telemetry.
          if grep -q 'fespalier telemetry' build/web/main.dart.js; then
            echo "::error::the profile build contains fespalier's telemetry code, though nothing opts in"
            exit 1
          fi
          flutter build web --release --no-wasm-dry-run
          for needle in 'ext\.fespalier' 'fespalier:' 'ToolEvent' 'fespalier views' 'fespalier containers' 'fespalier telemetry'; do
            if grep -q "$needle" build/web/main.dart.js; then
              echo "::error::the release build contains fespalier's DevTools or telemetry code ($needle)"
              exit 1
            fi
          done
      # `fespalier: adapters:` (since 0.9.0): an app that lists a package gets a generated main() that
      # calls the six members of its `adapter`, through app.g.dart's AppAdapters (since 0.11.0),
      # which imports `package:<name>/fespalier_adapter.dart`. A
      # stand-in package overrides every one of them, so the generated file has to compile against the
      # `FespalierAdapter` it extends. It goes after the release-build checks above, which have
      # their own meaning, and reuses the fresh app.
      - name: An app with adapters compiles
        env:
          FSP_BIN: ${{ github.workspace }}/cli/target/debug/fsp
        run: |
          cd "$RUNNER_TEMP"
          flutter create --template=package --project-name demo_adapter demo_adapter
          (cd demo_adapter && flutter pub add fespalier --path "$GITHUB_WORKSPACE/packages/fespalier")
          cat > demo_adapter/lib/fespalier_adapter.dart <<'DART'
          import 'package:fespalier/startup.dart';
          import 'package:flutter/widgets.dart';

          const adapter = DemoAdapter();

          class DemoAdapter extends FespalierAdapter {
            const DemoAdapter();

            @override
            Future<void> zone(Future<void> Function() body) => body();

            @override
            Future<void>? beforeRun() => null;

            @override
            List<Override> overrides() => const [];

            @override
            List<ProviderObserver> providerObservers() => const [];

            @override
            List<NavigatorObserver> routerObservers() => const [];

            @override
            Widget wrap(Widget root) => root;
          }
          DART
          cd fresh_app
          flutter pub add demo_adapter --path ../demo_adapter
          if grep -q '^fespalier:' pubspec.yaml; then
            sed -i '/^fespalier:/a\  adapters: [demo_adapter]' pubspec.yaml
          else
            printf 'fespalier:\n  adapters: [demo_adapter]\n' >> pubspec.yaml
          fi
          "$FSP_BIN" gen
          grep -q "package:demo_adapter/fespalier_adapter.dart' as _a0" lib/app.g.dart
          grep -q 'AppMain.routerObservers()' lib/app.main.g.dart
          flutter analyze
      - name: dart run fespalier runs the given fsp
        working-directory: examples/shop
        run: |
          cargo build --quiet --manifest-path ../../cli/Cargo.toml
          flutter pub get
          FSP_BINARY="$PWD/../../cli/target/debug/fsp" dart run fespalier --version
          FSP_BINARY="$PWD/../../cli/target/debug/fsp" dart run fespalier routes
      # `fsp dev` against the real flutter (since 0.9.0): a fresh web app in headless Chrome. It
      # waits for the app, adds a route (a hot restart), edits a page (a hot reload) and quits with
      # `q`. Every other test of `fsp dev` talks to a fake flutter; this is the one that notices when
      # flutter changes its `--machine` protocol. The script is `just dev-e2e`.
      - name: fsp dev runs the app, restarts on a new route and reloads on an edit
        timeout-minutes: 10
        env:
          FSP_BIN: ${{ github.workspace }}/cli/target/debug/fsp
        run: scripts/check-dev-e2e.sh

  # `fsp create` (since 0.15.0) against the real flutter: the base app, each optional feature on its
  # own, and every feature at once, made with this checkout as the packages (`--local-packages`) and
  # checked with `dart format`, `flutter analyze` and `flutter test`. The cases are not written here:
  # `create-cases` asks the binary for them (`fsp create --list-features --json`, through
  # scripts/check-create.sh --list), so a feature that lands is a case from its first change. The
  # script is `just create-check`.
  create-cases:
    name: Cases of fsp create
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - name: List the cases
        id: cases
        shell: bash
        run: |
          scripts/check-create.sh --list | tee "$RUNNER_TEMP/cases.txt"
          echo "cases=$(jq -Rsc 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/cases.txt")" >> "$GITHUB_OUTPUT"

  create:
    name: fsp create (${{ matrix.case }})
    needs: create-cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.create-cases.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Make the app, then dart format, analyze and test it
        env:
          CASE: ${{ matrix.case }}
        run: scripts/check-create.sh "$CASE"

  # The declared floor, for what `fsp create` writes: the base app and the app with every feature that
  # Flutter runs (`all`), made (in a temporary folder, by scripts/check-create.sh) on FLUTTER_FLOOR_VERSION,
  # then analyzed and tested; then `otel`, which needs a newer Flutter, on FLUTTER_OTEL_FLOOR_VERSION.
  # A new app takes the newest dependencies its Flutter allows, so this proves that the code a person
  # starts from compiles on the oldest Flutter we claim, as the `floor` job above does for the packages
  # at their lowest. No `dart format` here (FSP_CREATE_SKIP_FORMAT): its output depends on the SDK, and
  # the `create` job checks it.
  create-floor:
    name: fsp create (Flutter 3.32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/cli/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_FLOOR_VERSION }}
          cache: true
      - run: flutter --version
      - name: Make the base app and the app with every feature, then analyze and test them
        env:
          FSP_CREATE_SKIP_FORMAT: "1"
        run: scripts/check-create.sh base all
      # `all` above leaves `otel` out (it needs Flutter 3.35, and says so); this is the Flutter it
      # does run on, with the two features that compose.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_OTEL_FLOOR_VERSION }}
          cache: true
      - run: flutter --version
      - name: Make the apps with otel, alone and with sentry, then analyze and test them
        env:
          FSP_CREATE_SKIP_FORMAT: "1"
        run: scripts/check-create.sh otel telemetry

  # examples/cose: a CrateStack server (a Rust crate of its own, examples/cose/server) that checks a
  # COSE_Sign1 signature on every request, and the Flutter app that signs them. The `dart` job above
  # already runs the app's tests (its end-to-end test skips there: no server binary); this job
  # builds the server and runs that test against it with FSP_REQUIRE_COSE_SERVER=1, which fails the
  # test instead of skipping it, so the job cannot go green by not running the server. It is not in
  # the `floor` job: fespalier_sign_keypair needs Flutter 3.44. `just cose` runs the same steps.
  cose:
    name: COSE example (server and app, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The server crate pins its own toolchain (cli/tests/versions.rs checks it equals the
      # generator's); this reads it from there.
      - name: Read the Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$GITHUB_WORKSPACE/examples/cose/server/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, resolved 2026-09-30
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/cose/server
      # Tests include the two that fail when server/contracts.json or the app's
      # lib/src/contracts.g.dart is stale against schema.cstack.
      - name: Server (fmt, clippy, tests, locked build)
        working-directory: examples/cose/server
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      # Licences, advisories, sources: examples/cose/server/deny.toml (cratestack's graph brings a few
      # more licences than the generator's).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: examples/cose/server/Cargo.toml
          command: check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: App (pub get, dart format, analyze)
        working-directory: examples/cose
        run: |
          flutter pub get
          find . -name '*.dart' ! -name '*.g.dart' -not -path './.dart_tool/*' -not -path './build/*' -print0 |
            xargs -0 dart format --output=none --set-exit-if-changed
          flutter analyze
      # Plain `test`s over real sockets: register the device key, a signed write and read, and every
      # refusal (unregistered key, tampered payload, plain CBOR, COSE to the plain op, replay).
      - name: App tests, the end-to-end one against the server binary
        working-directory: examples/cose
        env:
          COSE_SERVER_BIN: ${{ github.workspace }}/examples/cose/server/target/debug/cose-demo-server
          FSP_REQUIRE_COSE_SERVER: "1"
        run: flutter test

  web:
    name: Deferred routes split on the web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # `flutter build web --release` of examples/shop in a throwaway copy (the examples stay
      # platform-free): each deferred page must be a main.dart.js_N.part.js of its own, with its
      # strings out of main.dart.js. Then `fsp size --check` holds the build to the budgets in the
      # shop's `size:` section, and its attribution is cross-checked against those strings (the
      # script builds `fsp`, which is why the timeout is 30 minutes). The script is `just web-chunks`.
      - name: Each deferred page is a chunk of its own, within its budget
        run: scripts/check-deferred-chunks.sh examples/shop '/checkout=Place order' '/products/:id=Add to cart'

  web-routes:
    name: Maestro flows open their routes on the web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/web-routes/package-lock.json
      # Playwright and the Chromium build it pins: both come from ci/web-routes/package-lock.json
      # (an exact `playwright` version), so the browser only changes when that file does.
      - name: Install the browser check
        working-directory: ci/web-routes
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      # A release web build of examples/shop (no CDN) in a throwaway copy, served locally with every
      # other request blocked; each flow in examples/shop/.maestro/routes is replayed: open the url,
      # open the link, wait for its Semantics identifier. The script is `just web-routes`.
      - name: Each committed flow's route shows on the web
        run: scripts/check-web-routes.sh examples/shop

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Compile and unit-test
        run: npm test
      - name: Package the extension
        run: npx --no-install vsce package --no-dependencies

  intellij:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The 2025.2 platform the plugin builds against is compiled for Java 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      - name: Compile and test (unit tests, and one headless IDE test)
        run: ./gradlew build --no-daemon
      - name: Package the plugin
        run: ./gradlew buildPlugin verifyPluginStructure --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fespalier-intellij
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error

  packaging:
    name: Homebrew and Scoop files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render from fake checksums
        run: python3 scripts/test_packaging.py
      - name: Pin fake checksums in the Dart package
        run: python3 scripts/test_pin_checksums.py
      - name: Refuse binaries that are not the pinned ones
        run: python3 scripts/test_verify_staged.py
      - name: Stage, fetch, attach and publish release assets (fake GitHub API)
        run: python3 scripts/test_release_assets.py

  telemetry:
    name: Telemetry stack files and dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The generated dashboards are fresh (`just telemetry-dashboards` writes them), every query
      # uses only the telemetry conventions, compose.yaml pins its images and `docker compose config`
      # accepts it (the runner has Compose, so a missing one fails here instead of skipping), and
      # the dashboard importer runs against a fake OpenObserve. Nothing is started.
      - name: Dashboards fresh, queries on the conventions, importer, compose file
        env:
          FSP_REQUIRE_DOCKER: "1"
        run: python3 scripts/test_telemetry.py

  telemetry-smoke:
    name: Telemetry stack runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pulls the pinned images (about 1.9 GB with Grafana), starts the stack, sends a seeded session
      # through the collector, and runs every dashboard panel's query in OpenObserve and Grafana:
      # no errors, and the SQL counts equal the PromQL counts equal the seed's. `just telemetry-smoke`.
      - name: Start the stack, send spans, run every panel's query on both backends
        run: python3 scripts/telemetry/smoke.py

  skills:
    name: Skills match the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate asks git whether each skill's stamp descends from the baseline commit in
          # skills/coverage.json, and when a file was added; a shallow clone has neither.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Every README and docs/ section, file kind, config key and fsp command claimed by a skill,
      # and every claim still real; frontmatter, version stamps, and every link and anchor in the
      # documentation (skills/README.md).
      - name: Coverage, both ways
        run: node scripts/skills/verify-coverage.mjs
      - name: Formatted (prettier)
        run: npx --yes prettier@3.8.1 --check README.md "docs/*.md" "skills/**/*.{md,json}"
