# Publishes packages/fespalier to pub.dev with pub.dev's GitHub Actions automated publishing
# (OIDC: no token or secret is stored anywhere).
#
# Run it manually, from the tag of the release: Actions > Publish to pub.dev > Run workflow >
# "Use workflow from" > Tag > v<version>. pub.dev only accepts an OIDC token whose ref is a tag
# matching its "tag pattern" (v{{version}}), so a run from a branch is refused here first.
# `release.yml` creates that v<version> tag (manual publish, or push the tag yourself).
#
# One-time setup on pub.dev is described in docs/releasing.md.
name: Publish to pub.dev

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half-way: a second run for the same ref queues behind the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches packages/fespalier/pubspec.yaml
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from the release tag (Use workflow from > Tag > v<version>), not from ${GITHUB_REF_NAME}; pub.dev only accepts tag runs"
            exit 1
          fi
          version=$(sed -n 's/^version: *//p' packages/fespalier/pubspec.yaml | head -n 1 | tr -d "\"' ")
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/fespalier/pubspec.yaml version ${version} (pub.dev's tag pattern is v{{version}})"
            exit 1
          fi
          echo "publishing fespalier ${version} from ${GITHUB_REF_NAME}"

  publish:
    name: Publish
    needs: verify
    permissions:
      id-token: write # the OIDC token pub.dev verifies
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/fespalier
      # To gate every publish behind reviewers, create a GitHub environment named `pub.dev`,
      # tick "Require GitHub Actions environment" on pub.dev, and uncomment:
      # environment: pub.dev
