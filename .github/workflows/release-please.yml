name: release-please

# Proposes the next release as a pull request, and cuts the tag when that
# pull request merges.
#
# Adopted from vaam-apps/vsms, the org's reference implementation
# (docs/releasing.md in vaam-apps/.github is the source of truth for every
# trap below).
#
# The shape of a release here, before and after:
#
#   before  a maintainer bumped four version files and the READMEs by hand,
#           ran the Release workflow with `publish` ticked, and a
#           GITHUB_TOKEN push put the checksum pins on main.
#   after   every merge to `main` updates a standing release PR. On that PR
#           the `release-pins` workflow builds the five fsp binaries and
#           commits their checksums. Merging it creates the `vX.Y.Z` tag and
#           a draft GitHub Release (this workflow), and `release.yml`, which
#           triggers on the tag, verifies the binaries it staged against the
#           pins in the tagged tree, attaches them and publishes the Release.
#
# So this workflow never publishes or builds anything itself. It only ever
# writes the version into the tree, refreshes Cargo.lock on the release
# branch, and creates the tag and the draft Release.
#
# ---------------------------------------------------------------------------
# Why a GitHub App token and not GITHUB_TOKEN
# ---------------------------------------------------------------------------
# This is load-bearing, not hygiene. GitHub deliberately does not raise
# workflow events for anything done with the default `GITHUB_TOKEN`, to stop
# a workflow triggering itself. So with `GITHUB_TOKEN`:
#
#   - the `vX.Y.Z` tag would be created and `release.yml` would NOT run.
#     No binaries, no release assets, no tap update: a release that looks cut
#     and published nothing, with nothing failing anywhere to say so.
#   - the release PR would get no `ci.yml` run and no `release-pins` run, so
#     its checksums would never be pinned.
#
# The App needs, on this repository: `contents: write` (branches, tags,
# releases) and `pull-requests: write`. Its id and private key are the
# organization secrets RELEASE_PLEASE_APP_CLIENT_ID (the App's **Client ID**,
# `Iv23li…`, not its numeric App ID) and RELEASE_PLEASE_APP_PRIVATE_KEY, which
# every repository in the org already has. If either is missing the token
# step fails outright rather than silently falling back to `GITHUB_TOKEN` — a
# fallback would produce exactly the silent publish-nothing release above.
#
# ---------------------------------------------------------------------------
# Why `release-type: simple`, although this is a Dart package
# ---------------------------------------------------------------------------
# docs/releasing.md (step 7) says `release-type: dart` for a Dart or Flutter
# package, because a Flutter app's `pubspec.yaml` reads `version: 1.2.3+45`
# and `simple` plus a generic annotation would leave the `+45` build number
# stale. That reason does not apply here: packages/fespalier/pubspec.yaml is
# a package consumed by git tag with no `+build` suffix (and `publish_to:
# 'none'`), so there is no build number to keep in step. And `dart` would
# bring trap 10: it derives a component from the pubspec (`fespalier`), the
# release PR's title carries none, release-please then cannot match the merged
# PR to its own tag ("PR component: undefined does not match configured
# component"), and the tag is never created — green checks, no release.
# `simple` derives no component. The pubspec is an annotated `extra-files`
# entry in the object form, exactly as in vaam-apps/flutter-otel-zone.
#
# `simple` writes `CHANGELOG.md` and, per `release-please-config.json`'s
# `extra-files`, the annotated version lines in five files: cli/Cargo.toml,
# packages/fespalier/pubspec.yaml, the `ref:` that `fsp init` prints
# (cli/src/init.rs), and the install snippets of the two READMEs. It also
# tries `version.txt` with `createIfMissing: false`, so with no such file
# that update is skipped.
#
# ---------------------------------------------------------------------------
# Why the release is a DRAFT until release.yml has attached the binaries
# ---------------------------------------------------------------------------
# release-please creates the tag and the GitHub Release in one API call, at
# the merge commit. The binaries cannot exist by then in a form that matches
# the pins (builds are not reproducible, so a rebuild on the tag would differ
# from the binaries whose checksums were pinned): they were built on the
# release PR and staged by `release-pins`. `release.yml` attaches exactly
# those. Until it has verified and attached them, nobody should see a release
# with no assets, and `install.sh` (which asks for the latest release) must
# not find one. `draft: true` does that, and `force-tag-creation: true` makes
# release-please create the tag itself (GitHub otherwise creates no tag for a
# draft until it is published), which is also what raises the tag-push event
# `release.yml` triggers on. A draft also keeps working if the repository
# ever turns on immutable releases, which would refuse assets on a published
# release. Both options are in release-please's own schema
# (`draft`, `force-tag-creation`), set in release-please-config.json.
#
# ---------------------------------------------------------------------------
# What this deliberately does NOT bump
# ---------------------------------------------------------------------------
#   - `cli/Cargo.lock`: generated; the lockfile-sync steps below refresh it.
#   - `editors/vscode` and `editors/intellij`: the plugins version on their
#     own (README "Releasing") and are published by hand to their
#     marketplaces.
#   - `examples/*`: they depend on the package by path.
#   - `packages/fespalier/lib/src/release_checksums.dart`: written by the
#     `release-pins` workflow (scripts/pin_checksums.py), never by a bump.
#   - `CHANGELOG.md`'s history: release-please inserts each new entry above
#     the first `## <version>` heading; the hand-written 0.3.0 and older
#     entries stay below it untouched.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never cancel a run that may be mid-way through force-pushing the release
# branch and then pushing lockfiles onto it. Keyed per ref like
# `release.yml`, for the same reason its own comment gives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The App token below carries every write this workflow performs; the
# workflow's own GITHUB_TOKEN needs nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  release-please:
    name: propose the next release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id`. They are DIFFERENT
          # values on the App's settings page — `app-id` is the numeric
          # App ID, `client-id` is the `Iv23li…` Client ID — so the
          # secret is named for the one this input actually wants.
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Without these the minted token carries every permission the App
          # installation holds org-wide - actions, issues, security-events and
          # the rest - into a job that needs none of them. zizmor flags exactly
          # that, as `github-app`. release-please needs only these two: open and
          # update the release PR, push its branch, create the tag.
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # --------------------------------------------------------------------
      # Lockfile sync
      # --------------------------------------------------------------------
      # release-please can only rewrite files it is pointed at, and a
      # Cargo.lock cannot be pointed at: it is generated, so an
      # `x-release-please-version` comment would not survive the next
      # `cargo` run, and `version = "0.3.1"` appears in it for third-party
      # crates too (`opaque-debug`, `rand_chacha` today) — a blind rewrite
      # corrupts it.
      #
      # This is not cosmetic. `ci.yml` runs `cargo metadata --locked` on the
      # root workspace and `cargo check --locked` on the excluded manifests,
      # and every production Dockerfile builds with `--locked`. A release PR
      # whose lockfiles still say the old version is red on arrival, and
      # `ci.yml:317`'s own comment records this exact failure happening for
      # v0.2.1 — found by a review bot, not by CI.
      #
      # `prs_created` is true for an UPDATED release PR as well as a newly
      # created one (the action sets it from `prs.length > 0`, where `prs`
      # is what `createPullRequests()` returned), so this runs on every
      # release-please run that touched the branch — which it must, because
      # release-please force-pushes that branch each time and would
      # otherwise drop the previous run's lockfile commit.
      - name: Check out the release branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `|| '{}'`, unlike vsms's own copy of this file: the checkout's `with:`
          # is evaluated even when the step's `if:` skips it, so on a run where
          # the open release PR "remained the same" (`prs_created` is false and
          # `outputs.pr` is never set) a bare `fromJSON('')` fails the whole
          # workflow with "Error reading JToken from JsonReader". Found live in
          # vaam-apps/vaam-apps (runs 36410441049 and 36409553495), which fixed
          # it the same way. `fromJSON('{}').headBranchName` is empty, and the
          # step is still skipped by its `if:`.
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          # Same App token, so the push below is an event GitHub will raise
          # — this is what gives the release PR a real `ci.yml` run.
          token: ${{ steps.app-token.outputs.token }}
          # Never write that token into .git/config, where anything later
          # uploading the workspace as an artifact would carry it out with it
          # (zizmor `artipacked`). The push below supplies it explicitly on the
          # remote URL instead - the same shape vaam-apps/.github's own
          # lint.yml already uses for its fix-commit push.
          persist-credentials: false

      - name: Install Rust
        if: steps.release.outputs.prs_created == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # `stable` branch head, 2026-09-19

      # No dependency cache here, deliberately. zizmor's `cache-poisoning`
      # audit flags a restored cache in a job that also publishes: a poisoned
      # entry could alter the very Cargo.lock this job commits onto the
      # release branch. The step below only runs `cargo metadata`, which
      # resolves and compiles nothing, and only on the runs that open a
      # release PR — so the cache bought very little and cost a supply-chain
      # surface in the release path.

      # Every Cargo.lock in the tree, found rather than listed. Four of them
      # carry a first-party version today (the root workspace's 21 members,
      # and `vsms-sdk-rust` in each of sdks/rust, examples/rust and
      # ci/e2e-integration); `deploy/backup-tool` versions independently and
      # simply produces no diff. A hardcoded list would be a fifth copy of
      # "which Rust roots exist" — the duplicated-list failure this repo has
      # already been bitten by — and a new excluded crate would go stale in
      # it silently.
      #
      # `cargo metadata` without `--locked` is precisely the inverse of the
      # check `ci.yml` runs: same command, same resolution, but allowed to
      # write the result back.
      - name: Refresh every Cargo.lock
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          git ls-files '*Cargo.lock' | while read -r lock; do
            dir="$(dirname "$lock")"
            echo "::group::cargo metadata in ${dir}"
            (cd "$dir" && cargo metadata --format-version 1 > /dev/null)
            echo "::endgroup::"
          done

      - name: Commit the lockfiles, if the version bump moved any
        if: steps.release.outputs.prs_created == 'true'
        env:
          # Via env, never inlined into the script: `${{ }}` inside a `run:` body
          # is textual substitution, and a branch name is not ours to trust.
          TOKEN: ${{ steps.app-token.outputs.token }}
          # `|| '{}'` is load-bearing, not defensive noise: GitHub evaluates a
          # step's `env:` even when its `if:` skips the step, so on any run with
          # no releasable commits `outputs.pr` is empty and a bare `fromJSON('')`
          # fails the whole workflow with "Error reading JToken from JsonReader".
          # (vsms's comment says the checkout's `with:` does not have this
          # problem; it does, see the comment there.)
          HEAD_REF: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          if git diff --quiet -- '*Cargo.lock'; then
            echo "no lockfile changed — nothing to push"
            exit 0
          fi
          git config user.name  'release-please[bot]'
          git config user.email 'release-please[bot]@users.noreply.github.com'
          git add -- '*Cargo.lock'
          git commit -m 'chore: sync Cargo.lock files with the release version'
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"
          echo "### Lockfiles synced" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD~1 -- '*Cargo.lock' >> "$GITHUB_STEP_SUMMARY"
