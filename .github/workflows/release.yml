# Builds the `fsp` binary for every supported platform so Flutter developers can
# install it without Rust (see install.sh).
#   - push of a `v*` tag: verify the tag matches cli/Cargo.toml, build, publish a GitHub Release
#   - manual run (workflow_dispatch): build only, archives are kept as workflow artifacts
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-15-intel }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches cli/Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' cli/Cargo.toml | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match cli/Cargo.toml version ${crate_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -czf "dist/fsp-${{ matrix.target }}.tar.gz" -C "cli/target/${{ matrix.target }}/release" fsp
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "fsp-${{ matrix.target }}.tar.gz" > "fsp-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "fsp-${{ matrix.target }}.tar.gz" > "fsp-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $zip = "fsp-${{ matrix.target }}.zip"
          Compress-Archive -Path "cli/target/${{ matrix.target }}/release/fsp.exe" -DestinationPath "dist/$zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$zip").Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/$zip.sha256", "$hash  $zip`n")

      - uses: actions/upload-artifact@v4
        with:
          name: fsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fsp-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
