name: Release

# Publishes an fsp release. Nobody starts this by hand: merging the release-please PR makes
# release-please create the tag `vX.Y.Z` and a DRAFT GitHub Release (release-please.yml), and the
# tag push starts this workflow.
#
#   push of a `v*.*.*` tag   guard, then publish
#   workflow_dispatch        build-only smoke test of the five targets and of the Homebrew and
#                            Scoop rendering; the archives are kept as workflow artifacts and
#                            nothing is published (the old `publish` input is gone)
#
# Nothing is built here on a tag. The binaries were built on the release PR by release-pins.yml,
# their SHA-256s were committed to that PR (packages/fespalier/lib/src/release_checksums.dart,
# which `dart run fespalier` verifies its download against), and the archives themselves wait in
# a staging draft release. Builds are not reproducible, so a rebuild would not match the pins.
# `publish` fetches the staged archives and, before attaching anything,
#   - checks that they are the tag's version, built from the tag's cli/ tree, and that every
#     archive's SHA-256 equals the pin in the tagged tree (scripts/verify-staged.sh), and
#   - regenerates the .sha256 files and the Homebrew formula and Scoop manifest from those
#     verified archives (scripts/packaging.py), so the derived files cannot disagree with them.
# Then it attaches the archives to the draft Release that release-please created (this workflow
# creates no release: one per tag), publishes it and deletes the staging draft. The Release is
# invisible to users, and `latest` does not move, until all of that has succeeded.
#
# Homebrew and Scoop are optional: see the `homebrew` and `scoop` jobs. Without the repository
# variables HOMEBREW_TAP / SCOOP_BUCKET the release still publishes, with fsp.rb and fsp.json
# attached as assets.
#
# Every write uses the org's release-please App token, scoped to contents: write; there is no
# fallback to GITHUB_TOKEN (org releasing.md, trap 1). GITHUB_TOKEN here only reads the checkout.
#
# If this fails the release stays a draft with the tag in place: fix the cause and re-run the
# failed jobs. See docs/releasing.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions: {}

# Keyed per ref, never cancelling: a publish interrupted halfway is the one failure that cannot
# be re-run into a clean state, and under a global key a newer pending run cancels an older
# pending one (org releasing.md, trap 11).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag names the version every artifact ships as; nothing else compares it with the files.
  guard:
    name: Tag matches every version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the manifest versions
        id: guard
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # scripts/read-version.sh tolerates the trailing `# x-release-please-version` on the
          # version lines (an end-anchored sed reads them as EMPTY: how vsms published nothing
          # for v0.3.2) and fails on an empty result. `cargo test --test versions` runs these
          # same extractions on every PR, because this job only ever runs on a tag, i.e. after
          # the release PR has merged.
          CARGO="$(scripts/read-version.sh cargo)"
          PUBSPEC="$(scripts/read-version.sh pubspec)"
          MANIFEST="$(scripts/read-version.sh manifest)"
          LOCK="$(scripts/read-version.sh lock)"
          echo "tag=${TAG} cargo=${CARGO} pubspec=${PUBSPEC} manifest=${MANIFEST} lock=${LOCK}"
          for v in "$CARGO" "$PUBSPEC" "$MANIFEST" "$LOCK"; do
            [[ "$v" == "$TAG" ]] || { echo "::error::tag v${TAG} does not match a version (see above)"; exit 1; }
          done
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  publish:
    name: Verify, attach and publish
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id`: the `Iv23li…` Client ID.
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Reads the staging draft, uploads to the release, publishes it, deletes the staging
          # draft. Without this the token carries every permission the App holds.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the binaries staged on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release-assets.sh fetch staged

      # Refuses anything that is not the pinned build, before anything is attached.
      - name: Verify the staged archives against the pins in this tag
        run: scripts/verify-staged.sh "$VERSION" staged

      - name: Render the release files from the verified archives
        run: |
          set -euo pipefail
          mkdir release
          cp staged/fsp-*.tar.gz staged/fsp-*.zip release/
          cd release
          for f in fsp-*.tar.gz fsp-*.zip; do sha256sum "$f" > "$f.sha256"; done
          cd ..
          python3 scripts/test_packaging.py
          python3 scripts/packaging.py --version "$VERSION" --dist release --out release
          ls -l release
          cat release/fsp.rb release/fsp.json

      - name: Attach to the release release-please created
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release-assets.sh attach "$TAG" release/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release-assets.sh publish "$TAG"

      - name: Delete the staging draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release-assets.sh drop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsp-packaging
          path: |
            release/fsp.rb
            release/fsp.json
          if-no-files-found: error
          retention-days: 7

  # Optional: pushes fsp.rb to a Homebrew tap and fsp.json to a Scoop bucket. Each is its own job,
  # switched on by a repository variable that holds `owner/repo` (HOMEBREW_TAP, SCOOP_BUCKET);
  # unset, the job is skipped and the release is complete without it, with fsp.rb and fsp.json
  # attached as assets (Scoop installs straight from fsp.json's URL). The release-please App
  # token is scoped to that one repository, so the App must be installed on it with contents:
  # write; if it is not, the token step fails here, loudly, after the release is already
  # published (re-run the job once it is). The variable is read once, in `parse`, and checked
  # against the owner/repo shape before anything uses it. The repository may be brand new with
  # only a README: the checkout gets its default branch (`main`; nothing here assumes `master`),
  # the push goes back to that same branch, and Formula/ or bucket/ is created when missing.
  # A repository with no commit at all cannot be checked out.
  homebrew:
    name: Update Homebrew tap
    if: vars.HOMEBREW_TAP != ''
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ vars.HOMEBREW_TAP }}
    steps:
      - name: Read the tap repository from HOMEBREW_TAP
        id: parse
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)$ ]] || {
            echo "::error::HOMEBREW_TAP must be owner/repo, e.g. fespalier/homebrew-tap"
            exit 1
          }
          {
            echo "owner=${BASH_REMATCH[1]}"
            echo "repo=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token for the tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}
          permission-contents: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsp-packaging
          path: packaging

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: tap

      - name: Commit and push
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.TARGET }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp packaging/fsp.rb tap/Formula/fsp.rb
          git -C tap config user.name  'release-please[bot]'
          git -C tap config user.email 'release-please[bot]@users.noreply.github.com'
          git -C tap add Formula/fsp.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula/fsp.rb is already up to date"
          else
            git -C tap commit -m "fsp ${VERSION}"
            git -C tap push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
              "HEAD:refs/heads/$(git -C tap symbolic-ref --short HEAD)"
          fi

  scoop:
    name: Update Scoop bucket
    if: vars.SCOOP_BUCKET != ''
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ vars.SCOOP_BUCKET }}
    steps:
      - name: Read the bucket repository from SCOOP_BUCKET
        id: parse
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)$ ]] || {
            echo "::error::SCOOP_BUCKET must be owner/repo, e.g. fespalier/scoop-bucket"
            exit 1
          }
          {
            echo "owner=${BASH_REMATCH[1]}"
            echo "repo=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token for the bucket
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}
          permission-contents: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsp-packaging
          path: packaging

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: bucket

      - name: Commit and push
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.TARGET }}
        run: |
          set -euo pipefail
          mkdir -p bucket/bucket
          cp packaging/fsp.json bucket/bucket/fsp.json
          git -C bucket config user.name  'release-please[bot]'
          git -C bucket config user.email 'release-please[bot]@users.noreply.github.com'
          git -C bucket add bucket/fsp.json
          if git -C bucket diff --cached --quiet; then
            echo "bucket/fsp.json is already up to date"
          else
            git -C bucket commit -m "fsp ${VERSION}"
            git -C bucket push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
              "HEAD:refs/heads/$(git -C bucket symbolic-ref --short HEAD)"
          fi

  # Manual run: build and render only. Nothing is published, nothing is written.
  build:
    name: Build fsp (smoke test)
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/build-fsp.yml
    with:
      retention-days: 7

  packaging:
    name: Render Homebrew and Scoop files (smoke test)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fsp-*
          path: dist
          merge-multiple: true

      - name: Render
        run: |
          set -euo pipefail
          version="$(scripts/read-version.sh cargo)"
          python3 scripts/test_packaging.py
          python3 scripts/packaging.py --version "$version" --dist dist --out packaging
          cat packaging/fsp.rb packaging/fsp.json
