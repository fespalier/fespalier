[package]
name = "fespalier"
version = "0.3.0" # x-release-please-version
edition = "2021"
description = "File-tree routing for Flutter: reads lib/app/, checks how the files fit together, emits one mountable lib/app.g.dart"
license = "MIT"
repository = "https://github.com/vaam-apps/fespalier"
homepage = "https://github.com/vaam-apps/fespalier"
readme = "../README.md"
keywords = ["flutter", "router", "codegen", "dart", "go_router"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.13"
heck = "0.5"
minijinja = { version = "2", features = ["loader"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tree-sitter = "0.26"
tree-sitter-dart = "0.2"

[dev-dependencies]
tempfile = "3"
