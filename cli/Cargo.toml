[package]
name = "trellis-cli"
version = "0.1.0"
edition = "2021"
description = "File-tree router generator for Flutter: scans lib/app/, type-checks the tiny files, emits one mountable lib/app.g.dart"

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"

[dev-dependencies]
tempfile = "3"
