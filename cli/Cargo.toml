[package]
name = "fespalier"
version = "0.8.1" # x-release-please-version
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "File-tree routing for Flutter: reads lib/app/, checks how the files fit together, emits one mountable lib/app.g.dart"
license = "MIT"
repository = "https://github.com/fespalier/fespalier"
homepage = "https://github.com/fespalier/fespalier"
readme = "../README.md"
keywords = ["flutter", "router", "codegen", "dart", "go_router"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.13"
ctrlc = { version = "3.5", features = ["termination"] }
heck = "0.5"
minijinja = { version = "2", features = ["loader"] }
notify = "8"
# The full-screen view of `fsp dev` (crossterm comes through it: `ratatui::crossterm`, so no version skew).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tree-sitter = "0.26"
tree-sitter-dart = "0.2"

# `killpg` for `fsp dev`: the crate `ctrlc` already pulls in on Unix, at the same version.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The generator does not panic on input it did not construct itself (test code may: see
# clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints this code base trips on purpose or in bulk. Fixing them would be churn in a
# resolver and emitter that hundreds of tests pin, so each is allowed here, with its reason,
# rather than at dozens of use sites.
#
# Every fallible function returns anyhow's `Result` with a message for the person running
# `fsp`; a per-fn `# Errors` section would restate it (and this is a binary, not a library).
missing_errors_doc = "allow"
# The resolver and the scaffolder walk one tree and are long because they share its state;
# splitting them would only move the locals into a struct.
too_many_lines = "allow"
# Config and scaffold structs mirror CLI flags and pubspec keys, which are booleans.
struct_excessive_bools = "allow"
# Local helper fns and consts sit next to the one statement that uses them.
items_after_statements = "allow"
# Dart source and messages are built by appending or collecting `format!` pieces; a `write!`
# per piece is noisier.
format_push_string = "allow"
format_collect = "allow"
# `fespalier.output` must end in a lowercase `.dart`: that is the extension, not a guess.
case_sensitive_file_extension_comparisons = "allow"
# Spans and line numbers come from files that fit in memory on any target.
cast_possible_truncation = "allow"
# Short, local names (`r`, `d`, `sec`, `sid`) are the house style for the resolver's loops.
similar_names = "allow"
many_single_char_names = "allow"
# Helper methods on a walker keep `self` for a uniform call style; by-value and `&Option`
# parameters are what the callers already hold.
unused_self = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
unnecessary_wraps = "allow"
match_same_arms = "allow"
assigning_clones = "allow"
