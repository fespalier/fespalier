# cargo-deny configuration. `just deny` / `just ci`, and the cargo-deny step in ci.yml.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate advisories count only for our direct dependencies; vulnerability
# advisories still fail the check for any crate in the graph.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# What the dependency tree of `fsp` actually uses (`cargo metadata`), and nothing else.
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
