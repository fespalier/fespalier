# Pinned to the latest stable (1.98.1, 2026-09-01). CI reads this file too (the
# "Read the Rust toolchain" step in .github/workflows/ci.yml and release.yml), so a bump is
# one PR that touches this file, and `rust-version` in Cargo.toml moves with it.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
