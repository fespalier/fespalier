# Written by `fsp telemetry`: don't edit it, run `fsp telemetry` again.
# OTLP in (HTTP 4318 with CORS for browsers, gRPC 4317); traces, logs and derived metrics out to OpenObserve.
extensions:
  basicauth/openobserve:
    client_auth:
      username: ${env:FSP_O2_EMAIL}
      password: ${env:FSP_O2_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["http://localhost:*", "http://127.0.0.1:*", "${env:FSP_OTLP_CORS_ORIGIN}"]
          allowed_headers: ["*"]
          max_age: 7200

connectors:
  span_metrics:
    namespace: fespalier
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    metrics_flush_interval: 15s
    histogram:
      unit: ms
      explicit:
        buckets: [1ms, 2ms, 5ms, 10ms, 16ms, 33ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
    exclude_dimensions: [span.kind]
    dimensions:
      # BEGIN generated by build_dashboards.py
      - name: fespalier.operation
      - name: fespalier.route
      - name: fespalier.file
      - name: fespalier.async
      - name: error.type
      - name: fespalier.navigation.kind
      - name: fespalier.navigation.outcome
      - name: fespalier.navigation.redirected
      - name: fespalier.guard.decision
      - name: fespalier.data.state
      - name: fespalier.action.name
      - name: fespalier.action.result
      - name: fespalier.deferred.result
      # END generated
  count:
    logs:
      fespalier.app.errors:
        description: Log records at ERROR or above.
        conditions:
          - log.severity_number >= SEVERITY_NUMBER_ERROR
        attributes:
          - key: exception.type
            default_value: unknown
      fespalier.app.crashes:
        description: otel_zone's native crash and ANR records.
        conditions:
          - log.attributes["event.name"] == "device.crash"
          - log.attributes["event.name"] == "device.anr"
        attributes:
          - key: event.name

processors:
  batch: {}
  # Only fespalier's spans become metrics (otel_zone's Riverpod and route spans don't).
  filter/fespalier:
    error_mode: ignore
    traces:
      span:
        - span.attributes["fespalier.operation"] == nil

exporters:
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: default

service:
  extensions: [basicauth/openobserve]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/openobserve]
    traces/fespalier:
      receivers: [otlp]
      processors: [filter/fespalier]
      exporters: [span_metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/openobserve, count]
    metrics:
      receivers: [otlp, span_metrics, count]
      processors: [batch]
      exporters: [otlp_http/openobserve]
