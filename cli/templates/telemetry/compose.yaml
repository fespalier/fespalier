# fespalier's local telemetry stack (since 0.8.1). Written by `fsp telemetry`: don't edit it, run
# `fsp telemetry` again. Settings go in .env next to this file (see env.example).
# Runs as it is too: `docker compose up -d`, and `--profile grafana` for Grafana.
name: fespalier-telemetry

x-openobserve-credentials: &credentials
  FSP_O2_EMAIL: ${FSP_O2_EMAIL:-dev@fespalier.local}
  FSP_O2_PASSWORD: ${FSP_O2_PASSWORD:-Fespalier-local-1}

services:
  collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/fespalier/collector.yaml"]
    environment:
      <<: *credentials
      FSP_OTLP_CORS_ORIGIN: ${FSP_OTLP_CORS_ORIGIN:-http://localhost}
    volumes:
      - ./collector/config.yaml:/etc/fespalier/collector.yaml:ro
    ports:
      - "${FSP_OTLP_BIND:-127.0.0.1}:${FSP_OTLP_GRPC_PORT:-4317}:4317"
      - "${FSP_OTLP_BIND:-127.0.0.1}:${FSP_OTLP_HTTP_PORT:-4318}:4318"
    depends_on: [openobserve]
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4@sha256:d4a878fac1f6c56003764f7f2a1625668917388f167e222c8c810de3f54c56ba
    environment:
      ZO_ROOT_USER_EMAIL: ${FSP_O2_EMAIL:-dev@fespalier.local}
      ZO_ROOT_USER_PASSWORD: ${FSP_O2_PASSWORD:-Fespalier-local-1}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    volumes:
      - openobserve-data:/data
    ports:
      - "127.0.0.1:${FSP_O2_PORT:-5080}:5080"
    restart: unless-stopped

  dashboards:
    image: python:3.14.8-alpine3.24@sha256:8acac70227ce3b34da9453120c375cc5b66cd0b062d4dc6bc74286f81a3819e1
    command: ["python3", "/fespalier/import.py"]
    environment:
      <<: *credentials
      FSP_O2_URL: http://openobserve:5080
      FSP_O2_WAIT: ${FSP_O2_WAIT:-180}
      FSP_O2_PORT: ${FSP_O2_PORT:-5080}
    volumes:
      - ./openobserve:/fespalier:ro
      - dashboards-state:/state
    depends_on: [openobserve]
    restart: "no"

  grafana:
    profiles: [grafana]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      <<: *credentials
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FSP_GRAFANA_PASSWORD:-Fespalier-local-1}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/fespalier/grafana-dashboards/health.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/fespalier/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${FSP_GRAFANA_PORT:-3000}:3000"
    depends_on: [openobserve]
    restart: unless-stopped

volumes:
  dashboards-state:
  openobserve-data:
  grafana-data:
