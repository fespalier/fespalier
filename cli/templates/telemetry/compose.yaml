# fespalier's local telemetry stack (since 0.8.1). Written by `fsp telemetry`: don't edit it, run
# `fsp telemetry` again. Settings go in .env next to this file (see env.example).
# Runs as it is too: `docker compose up -d`, and `--profile grafana` for Grafana.
# Images are pinned by tag and digest. The collector comes from its own registry (ghcr.io), the rest
# from mirror.gcr.io, Google's mirror of Docker Hub (the same images and digests), so a pull does not
# count against the anonymous limits of Docker Hub or Amazon ECR Public.
name: fespalier-telemetry

x-openobserve-credentials: &credentials
  FSP_O2_EMAIL: ${FSP_O2_EMAIL:-dev@fespalier.local}
  FSP_O2_PASSWORD: ${FSP_O2_PASSWORD:-Fespalier-local-1}

services:
  collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    command: ["--config=/etc/fespalier/collector.yaml"]
    environment:
      <<: *credentials
      FSP_OTLP_CORS_ORIGIN: ${FSP_OTLP_CORS_ORIGIN:-http://localhost}
    volumes:
      - ./collector/config.yaml:/etc/fespalier/collector.yaml:ro
    ports:
      - "${FSP_OTLP_BIND:-127.0.0.1}:${FSP_OTLP_GRPC_PORT:-4317}:4317"
      - "${FSP_OTLP_BIND:-127.0.0.1}:${FSP_OTLP_HTTP_PORT:-4318}:4318"
    depends_on: [openobserve]
    restart: unless-stopped

  openobserve:
    image: mirror.gcr.io/openobserve/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    environment:
      ZO_ROOT_USER_EMAIL: ${FSP_O2_EMAIL:-dev@fespalier.local}
      ZO_ROOT_USER_PASSWORD: ${FSP_O2_PASSWORD:-Fespalier-local-1}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    volumes:
      - openobserve-data:/data
    ports:
      - "127.0.0.1:${FSP_O2_PORT:-5080}:5080"
    restart: unless-stopped

  dashboards:
    image: mirror.gcr.io/library/python:3.14.8-alpine3.24@sha256:8acac70227ce3b34da9453120c375cc5b66cd0b062d4dc6bc74286f81a3819e1
    command: ["python3", "/fespalier/import.py"]
    environment:
      <<: *credentials
      FSP_O2_URL: http://openobserve:5080
      FSP_O2_WAIT: ${FSP_O2_WAIT:-180}
      FSP_O2_PORT: ${FSP_O2_PORT:-5080}
    volumes:
      - ./openobserve:/fespalier:ro
      - dashboards-state:/state
    depends_on: [openobserve]
    restart: "no"

  grafana:
    profiles: [grafana]
    image: mirror.gcr.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      <<: *credentials
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FSP_GRAFANA_PASSWORD:-Fespalier-local-1}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/fespalier/grafana-dashboards/health.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/fespalier/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${FSP_GRAFANA_PORT:-3000}:3000"
    depends_on: [openobserve]
    restart: unless-stopped

volumes:
  dashboards-state:
  openobserve-data:
  grafana-data:
