name: cose_example
description: fespalier example — CrateStack calls sealed as COSE_Sign1 by a device key (fespalier_keypair), against a server that checks them.
publish_to: none
version: 0.1.0

environment:
  # fespalier_keypair needs Dart 3.12 (Flutter 3.44): flutter_sign_keypair does.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # SHA-256 for the thumbprint, the request digest and the Sig_structure's hash.
  crypto: ^3.0.6
  fespalier:
    path: ../../packages/fespalier
  # The seam this example fills: a CrateStackTransport that seals every call
  # (lib/src/cose_transport.dart), reads that say how current they are (ref.serve) and writes
  # as intents (submit).
  fespalier_cratestack:
    path: ../../packages/fespalier_cratestack
  # The transport startup() builds once (HttpClientTransport over package:http), and the
  # HttpTransport every call is sent through.
  fespalier_http:
    path: ../../packages/fespalier_http
  # The device key: HardwareKeypairSigner (Secure Enclave, AndroidKeyStore) on a device, a
  # SoftwareKeypairSigner where there is none, FakeKeypairSigner in tests (its sign() is exactly
  # ESP256's r||s).
  fespalier_keypair:
    path: ../../packages/fespalier_keypair
  fespalier_transport:
    path: ../../packages/fespalier_transport
  flutter:
    sdk: flutter
  http: ^1.5.0
  # ESP256 verification of sealed responses (the signing is the device key's).
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # The test keys of the vectors are imported into its software signer. The same commit as
  # fespalier_keypair's pin.
  flutter_sign_keypair:
    git:
      url: https://github.com/vaam-apps/flutter-sign-keypair
      ref: c6a513781a3d11fd453268b0776447a45c679b32
  flutter_test:
    sdk: flutter

# fespalier_cratestack depends on fespalier, fespalier_stream (since 0.25.0) and fespalier_transport by repository
# tag, as an app does; here all are the checkout's.
dependency_overrides:
  fespalier:
    path: ../../packages/fespalier
  fespalier_stream:
    path: ../../packages/fespalier_stream
  fespalier_transport:
    path: ../../packages/fespalier_transport

flutter:
  uses-material-design: true
