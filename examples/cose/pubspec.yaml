name: cose_example
description: fespalier example — CrateStack calls sealed as COSE_Sign1 by a device key (fespalier_sign_keypair), against a server that checks them.
publish_to: none
version: 0.1.0

environment:
  # fespalier_sign_keypair needs Dart 3.12 (Flutter 3.44).
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # SHA-256 for the thumbprint, the request digest and the Sig_structure's hash.
  crypto: ^3.0.6
  fespalier:
    path: ../../packages/fespalier
  # The seam this example fills: a CrateStackTransport that seals every call
  # (lib/src/cose_transport.dart), reads that say how current they are (ref.serve) and writes
  # as intents (submit).
  fespalier_cratestack:
    path: ../../packages/fespalier_cratestack
  # The device key: SignKeypairSigner (Secure Enclave, AndroidKeyStore) on a device, a software
  # signer in tests (a DpopSigner, whose sign() is exactly ESP256's r||s).
  fespalier_sign_keypair:
    path: ../../packages/fespalier_sign_keypair
  flutter:
    sdk: flutter
  http: ^1.5.0
  # ESP256 verification of sealed responses (the signing is the device key's).
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # The test keys of the vectors are imported into its software signer. The same commit as
  # fespalier_sign_keypair's pin.
  flutter_sign_keypair:
    git:
      url: https://github.com/vaam-apps/flutter-sign-keypair
      ref: c6a513781a3d11fd453268b0776447a45c679b32
  flutter_test:
    sdk: flutter

# fespalier_sign_keypair and fespalier_cratestack depend on fespalier (the first through
# fespalier_auth, the second through fespalier_dio and fespalier_http) by repository tag, as an app does; here all
# are the checkout's.
dependency_overrides:
  fespalier:
    path: ../../packages/fespalier
  fespalier_auth:
    path: ../../packages/fespalier_auth
  fespalier_dio:
    path: ../../packages/fespalier_dio
  fespalier_http:
    path: ../../packages/fespalier_http

flutter:
  uses-material-design: true
