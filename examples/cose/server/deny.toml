# cargo-deny configuration for the cose example's server (`just cose-server`). The same policy as
# cli/deny.toml, plus the licences cratestack's dependency graph (axum, reqwest and rustls
# through the Rust client runtime, the dalek crates) brings in.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "Zlib",
  # Beyond cli/deny.toml, all permissive and OSI-approved or equivalent:
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
