name: cratestack_example
description: fespalier example — a CrateStack backend, a client generated by cratestack generate-dart --preset fespalier, and device-signed sessions (fespalier_sign_keypair), with no token and no Authorization header.
publish_to: none
version: 0.1.0

environment:
  # fespalier_keypair (the device keys) needs Dart 3.12 (Flutter 3.44): flutter_sign_keypair does.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # The time the session reads its expiries from: a test's fake clock ages the attestations.
  clock: ^1.1.1
  fespalier:
    path: ../../packages/fespalier
  fespalier_auth:
    path: ../../packages/fespalier_auth
  # ref.cancellable, ref.serve, CrateStackErrors, PortalTransport and TransportFailures.read: the
  # seams between the generated client and fespalier.
  fespalier_cratestack:
    path: ../../packages/fespalier_cratestack
  # The one transport the app sends through: HttpClientTransport over package:http, built once in
  # startup.dart.
  fespalier_http:
    path: ../../packages/fespalier_http
  # The device keys: KeypairSigners.device (Secure Enclave, AndroidKeyStore, a browser's CryptoKey).
  fespalier_keypair:
    path: ../../packages/fespalier_keypair
  # DeviceAuthBackend and DeviceSigner: the session is "this device is enrolled".
  fespalier_sign_keypair:
    path: ../../packages/fespalier_sign_keypair
  # HttpTransport, WriteGuardTransport and TransportZone.
  fespalier_transport:
    path: ../../packages/fespalier_transport
  flutter:
    sdk: flutter
  http: ^1.5.0
  # The client `cratestack generate-dart --preset fespalier` wrote from server/schema.cstack
  # (scripts/cratestack-client.sh). It sends through fespalier_transport and links no Dio.
  orders_client:
    path: client

dev_dependencies:
  # Decodes the CBOR requests the generated client sends, in the tests' fake server.
  cbor: ^6.5.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The packages depend on fespalier and on each other by git, as an app does; here all are the
# checkout's. The generated client's pubspec pins fespalier_transport by a commit of
# github.com/fespalier/fespalier (--fespalier-ref); the checkout's replaces it here too.
dependency_overrides:
  fespalier:
    path: ../../packages/fespalier
  fespalier_auth:
    path: ../../packages/fespalier_auth
  fespalier_keypair:
    path: ../../packages/fespalier_keypair
  fespalier_transport:
    path: ../../packages/fespalier_transport

flutter:
  uses-material-design: true
