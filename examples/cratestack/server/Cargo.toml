[package]
name = "orders-demo-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false
description = "The server of fespalier's cratestack example: a CrateStack RPC service whose every call is signed by a device (fespalier_sign_keypair)"

[lib]
name = "orders_demo_server"
path = "src/lib.rs"

[[bin]]
name = "orders-demo-server"
path = "src/main.rs"

[dependencies]
# Schema macros emit `::cratestack::*` paths, hence the rename. CrateStack's main at
# f78e71d2382cf873acf8c7d1a6d89d26f84cffb5, by commit: `@authn` (cratestack/cratestack#1244, the
# step-up rule `payOrder` declares in schema.cstack) is in no release yet (0.17.0 is the newest on
# crates.io). The same commit as CRATESTACK_REV in scripts/cratestack-client.sh, which builds the
# CLI the Dart client is generated with, so both sides speak one wire; move them together.
cratestack = { package = "cratestack-api", git = "https://github.com/cratestack/cratestack", rev = "f78e71d2382cf873acf8c7d1a6d89d26f84cffb5", default-features = false }
cratestack-codec-cbor = { git = "https://github.com/cratestack/cratestack", rev = "f78e71d2382cf873acf8c7d1a6d89d26f84cffb5", default-features = false }
# The generated structs derive through bare `serde::` paths.
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
base64 = "0.23"
getrandom = "0.4"
# ES256 (the attestations' signature and the device's) and the SHA-256 of a thumbprint, a query and
# a body. RustCrypto, no C code.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
