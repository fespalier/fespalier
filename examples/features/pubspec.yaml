name: features
description: fespalier example — every binding the generator knows, with widget tests.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fespalier:
    path: ../../packages/fespalier
  # Feature flags (since 0.9.0): /labs is behind one (lib/flags.dart).
  fespalier_flags:
    path: ../../packages/fespalier_flags
  # A saved team (shared preferences) for the next start (since 0.9.0): teams/$teamId/data.dart.
  fespalier_storage:
    path: ../../packages/fespalier_storage
  # refetchOnReconnect follows connectivity_plus (since 0.9.0): teams/$teamId/route.dart.
  fespalier_connectivity:
    path: ../../packages/fespalier_connectivity

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # go_router 18 looks for material_ui's MaterialApp, go_router 17 for
  # flutter's; the tests nest both so they pass on either.
  material_ui: ^1.0.0

# The fespalier_* packages depend on fespalier by git, as an app does; here all of them are the checkout's.
dependency_overrides:
  fespalier:
    path: ../../packages/fespalier

flutter:
  uses-material-design: true

# Paths match by case: /Docs/Guide is /docs/guide.
fespalier:
  case_sensitive: false
  # No two routes may pass the same literal `code:` to their meta.
  meta_unique: [code]
  # A `push`ed page shows its URL in the browser's address bar (go_router's
  # `optionURLReflectsImperativeAPIs`); the other examples keep the default, off.
  push_updates_url: true
  # Each page gets a PageStorage per history entry: the browser's back and forward bring a
  # keyed scrollable back to where it was (README, "Scroll restoration"); a `go` starts at the top.
  scroll_restoration: true
