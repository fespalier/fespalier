# cargo-deny configuration for the frb-cose example's Rust core (`just frb-cose-core`). The policy of the example's
# server (server/deny.toml, a copy of examples/cose/server/deny.toml): cli/deny.toml's, plus the licences cratestack's
# dependency graph (axum, reqwest and rustls through the Rust client runtime, the dalek crates) brings in, and the
# clarify below for flutter_rust_bridge's runtime.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # Beyond cli/deny.toml, all permissive and OSI-approved or equivalent:
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# flutter_rust_bridge's runtime depends on allo-isolate, which declares no `license` field: only a LICENSE file, the
# Apache License 2.0 text. The clarify names that licence and the file's checksum, so the crate counts under an
# allowed licence and a reviewer sees which text was read. The server does not link flutter_rust_bridge: no clarify.
[[licenses.clarify]]
name = "allo-isolate"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x7b5d04bc }]
