# The same channel as cli/rust-toolchain.toml (cli/tests/versions.rs fails when they differ), pinned
# here too because this crate has its own Cargo.lock and is built from its own directory: rustup
# honours the file next to where cargo runs. No `targets`: the Flutter hook never builds this
# crate (the core's rust/rust-toolchain.toml lists the targets it needs), so this file installs no
# cross-compilation std. A bump moves this file and cli/rust-toolchain.toml together (and
# `rust-version` in Cargo.toml when the minimum itself moves).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
