name: shop
description: fespalier example — products/$id end to end.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fespalier:
    path: ../../packages/fespalier
  # Product photos at the size their layout needs, from an image CDN (docs/responsive-images.md, "Images").
  fespalier_image:
    path: ../../packages/fespalier_image

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# fespalier_image depends on fespalier by git, as an app does; here both are the checkout's.
dependency_overrides:
  fespalier:
    path: ../../packages/fespalier

flutter:
  uses-material-design: true

# Read by the `fsp` generator. `none`: a failing data() shows error.dart at once
# and isn't retried behind the scenes (the default, `inherit`, leaves it to the
# ProviderScope's retry policy).
fespalier:
  data_retry: none
  # A string path that matches no route fails `fsp check` (the default is a warning).
  lints:
    unknown_path: error
  # Every page wears Semantics(identifier: 'route:<pattern>') and AppRoutes.mount() turns the
  # semantics tree on on the web: what Maestro reads (docs/route-tests.md, "Maestro flows (`fsp maestro`)").
  semantics_ids: true
  # `fsp maestro` writes .maestro/routes/ from the routes. Serve the web build on port 8080
  # (`flutter run -d web-server --web-port 8080`), then `maestro test .maestro/routes`.
  maestro:
    url: http://localhost:8080
    link: http://localhost:8080/#   # the default hash URL strategy
    samples:
      greet/$name: Ada
      products/$id: 1
  # `fsp size` reads build/web after `flutter build web`; `just web-chunks` checks these budgets
  # (docs/cli.md, "Web chunk sizes (`fsp size`)"). The measured sizes are 2.38 MB, 5,266 B and 6,028 B (fespalier_image
  # is in the first: the product list is eager, and its photos with it).
  size:
    main: 3 MB
    routes:
      /checkout: 8 KB
      /products/:id: 8 KB
