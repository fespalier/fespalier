name: shop
description: fespalier example — products/$id end to end.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fespalier:
    path: ../../packages/fespalier

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Read by the `fsp` generator. `none`: a failing data() shows error.dart at once
# and isn't retried behind the scenes (the default, `inherit`, leaves it to the
# ProviderScope's retry policy).
fespalier:
  data_retry: none
  # Every page wears Semantics(identifier: 'route:<pattern>') and AppRoutes.mount() turns the
  # semantics tree on on the web: what Maestro reads (README, "Maestro flows (`fsp maestro`)").
  semantics_ids: true
  # `fsp maestro` writes .maestro/routes/ from the routes. Serve the web build on port 8080
  # (`flutter run -d web-server --web-port 8080`), then `maestro test .maestro/routes`.
  maestro:
    url: http://localhost:8080
    link: http://localhost:8080/#   # the default hash URL strategy
    samples:
      greet/$name: Ada
      products/$id: 1
