[package]
name = "wire-sizes-demo-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false
description = "The server of fespalier's wire-sizes example: one schema served as JSON, CBOR and COSE_Sign1 CBOR, with every request measured on the wire"

[lib]
name = "wire_sizes_demo_server"
path = "src/lib.rs"

[[bin]]
name = "wire-sizes-demo-server"
path = "src/main.rs"

# The same run the tests drive, printed rather than asserted, so the report's numbers can be
# re-derived by anyone with a checkout instead of taken on trust.
[[bin]]
name = "wire-sizes-report"
path = "src/bin/report.rs"

[dependencies]
# Schema macros emit `::cratestack::*` paths, hence the rename. Exact pin: the wire format
# (binding version 2) moves with the crate.
cratestack = { package = "cratestack-api", version = "=0.15.3", default-features = false, features = ["cose"] }
cratestack-codec-cbor = { version = "=0.15.3", default-features = false }
cratestack-codec-json = { version = "=0.15.3", default-features = false }
# Transitive pins: the family moves together, and a mixed generation would change the wire
# format this example exists to measure.
cratestack-core = "=0.15.3"
cratestack-axum = "=0.15.3"
# The generated structs derive through bare `serde::` paths.
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
base64 = "0.23"
getrandom = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# The runner drives the router in process (`oneshot`) so it can read the server's own measurement
# back; that is library code, not a test-only helper, so the dependency is not a dev one.
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
