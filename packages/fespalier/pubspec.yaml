name: fespalier
description: File-tree routing for Flutter. Plain widgets and functions in lib/app/ (page, data, layout, guard, ...) become one typed go_router entry point, generated by fsp.
version: 0.9.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository (see the README's install snippet).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier
issue_tracker: https://github.com/fespalier/fespalier/issues
topics:
  - router
  - navigation
  - go-router
  - riverpod
  - codegen

# `dart run fespalier <command>` runs the fsp generator (bin/fespalier.dart);
# `dart pub global activate` installs it as `fsp`.
executables:
  fsp: fespalier

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  # What a data.dart's `freshness` and `dataCache` read the time from (since 0.8.1), so a test's
  # fake clock ages the data. Flutter's SDK pins 1.1.2.
  clock: ^1.1.1
  flutter:
    sdk: flutter
  # Only package:fespalier/testing.dart imports it. Apps already have it as a
  # dev dependency, so this adds nothing to a release build.
  flutter_test:
    sdk: flutter
  flutter_hooks: ">=0.20.0 <0.22.0"
  go_router: ">=17.0.0 <19.0.0"
  # 3.2.1: `Ref.mounted` is right for a stale ref and a paused provider resumes (what `freshness`
  # relies on, since 0.8.1), and the experimental `persist` that `dataCache` is built on.
  # 3.3.2 (since 0.9.0): its riverpod core is the oldest on which a closed prefetch handle disposes
  # its provider and `freshness` loads again; 23 of the package's tests fail on 3.2.1 (CI's `floor`
  # job runs `flutter pub downgrade`, so the constraint is checked).
  hooks_riverpod: ^3.3.2
  # RouteLink is built on its `Link`: on the web, a real <a href> over the child.
  url_launcher: ^6.3.0

dev_dependencies:
  # telemetry_trace_test.dart counts the microtasks fespalier's side schedules.
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  # Flutter's own flutter_test pins the version (3.0.9 on Flutter 3.32, the floor), so the constraint
  # must admit that one: `^3.0.10` made `flutter pub get` fail on 3.32.
  leak_tracker_flutter_testing: ^3.0.9
