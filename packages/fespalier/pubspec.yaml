name: fespalier
description: File-tree routing for Flutter. Plain widgets and functions in lib/app/ (page, data, loading, error, layout, guard) wired into one mountable go_router entry point by the fsp generator.
version: 0.1.1
homepage: https://github.com/vaam-apps/fespalier
repository: https://github.com/vaam-apps/fespalier/tree/main/packages/fespalier
issue_tracker: https://github.com/vaam-apps/fespalier/issues
topics:
  - router
  - navigation
  - go-router
  - riverpod
  - codegen

# `dart run fespalier <command>` runs the fsp generator (bin/fespalier.dart);
# `dart pub global activate` installs it as `fsp`.
executables:
  fsp: fespalier

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Only package:fespalier/testing.dart imports it. Apps already have it as a
  # dev dependency, so this adds nothing to a release build.
  flutter_test:
    sdk: flutter
  flutter_hooks: ">=0.20.0 <0.22.0"
  go_router: ">=17.0.0 <19.0.0"
  hooks_riverpod: ^3.0.0
