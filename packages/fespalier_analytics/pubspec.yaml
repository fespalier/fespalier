name: fespalier_analytics
description: "Screen views for fespalier, with consent: the route pattern, never the URL, to a backend of your own, and nothing sent or kept until the person has agreed. The analytics SDK is the app's."
version: 0.13.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_analytics
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # Riverpod and go_router come through it; this package adds no other dependency (no Firebase,
  # no PostHog, no OpenTelemetry: the vendor SDK is a recipe, and the sink needs nothing of
  # fespalier_otel).
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.13.1 # x-release-please-version

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# In this repository the package is built against the fespalier beside it. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
