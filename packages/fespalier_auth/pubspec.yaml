name: fespalier_auth
description: Signed-in routes for fespalier — a session provider, guards, token storage, lazy single-flight refresh and an authenticated HTTP client, with pluggable backends.
version: 0.20.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_auth
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # What every expiry check reads the time from, so a test's fake clock ages the tokens.
  clock: ^1.1.1
  collection: ^1.18.0
  # PKCE's S256 challenge (package:fespalier_auth/oidc.dart).
  crypto: ^3.0.6
  # Only package:fespalier_auth/dio.dart imports it: pure Dart, and tree-shaken when it is not used.
  # 5.7.0: the floor fespalier_dio and fespalier_cratestack claim, one constraint per dependency in this repository.
  dio: ^5.7.0
  # Not imported. dio 5.7.0 allows dio_web_adapter 1.0.0, which calls a `debugLog` that 5.7.0 lacks: a web build
  # of an app at its lowest versions does not compile. Depending on it steers every app's resolution to 1.0.1
  # or newer (dio 5.7.0 asks for ^1.0.0, later releases for ^2.1.0).
  dio_web_adapter: ">=1.0.1 <3.0.0"
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.20.0 # x-release-please-version
  # HttpCredentials, which the Authorizer implements (since 0.15.0).
  fespalier_http:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_http
      ref: v0.20.0 # x-release-please-version
  # Not imported. flutter_secure_storage_windows reaches path_provider, whose path_provider_linux reaches file
  # through xdg_directories and process and allows file 6.0.0. file before 6.1.3 does not compile on Dart 3.9
  # (`File.create` has no `exclusive:`), and a Linux or Windows build compiles that plugin's Dart code: an
  # app's `flutter pub downgrade` picks 6.0.0 and does not build. Depending on it steers every app's
  # resolution to 6.1.3 or newer.
  file: ">=6.1.3 <8.0.0"
  # SecureTokenStore. Both majors: only read/write/delete and the Apple accessibility option are used.
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  # 1.5.0: Abortable requests, which a replayed request keeps (the abort trigger is copied).
  http: ^1.5.0
  # Not imported. flutter_secure_storage_windows reaches path_provider, whose platform interface allows
  # platform 3.0.0, which reads `Platform.packageRoot`, gone from Dart 3: an app's `flutter pub downgrade`
  # picks it and does not compile. Depending on it steers every app's resolution to 3.1.4 or newer.
  platform: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
