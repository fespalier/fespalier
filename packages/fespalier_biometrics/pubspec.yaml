name: fespalier_biometrics
description: "Biometric unlock for fespalier: a guard that never prompts, a single-flight unlock() the app's unlock page calls, and withBiometrics for actions."
version: 0.21.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_biometrics
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # The unlock time is read through package:clock, so a test moves time. Flutter's SDK pins 1.1.2.
  clock: ^1.1.1
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # Riverpod and go_router come through it. local_auth is not a dependency: see the README.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.21.0 # x-release-please-version

dev_dependencies:
  # available_test.dart counts the timers a plugin that throws leaves behind (none).
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
