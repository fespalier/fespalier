name: fespalier_cratestack
description: Offline-first CrateStack clients for fespalier — reads that say how current they are, mutations queued with idempotency keys, owned rows merged field by field, and the sync triggers.
version: 0.23.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_cratestack
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # The test clock: fetchedAt, the HLC and the sync interval follow testWidgets' fake clock (fespalier pins the same).
  clock: ^1.1.1
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.23.1 # x-release-please-version
  # PortalTransport decorates an HttpTransport, TransportFailures reads its failures and
  # ref.cancellable runs a body under TransportZone (since 0.21.0; Dio was a dependency before):
  # the package links neither Dio nor package:http, test/no_http_test.dart checks it.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.23.1 # x-release-please-version
  # Only hive.dart imports it. Pure Dart: the floor fespalier_storage already proves on Flutter 3.35.
  hive_ce: ^2.16.0

dev_dependencies:
  # The end-to-end tests send a real Dio over TransportAdapter (lib/ imports neither). 5.7.0: the
  # lowest the floor job can test, the same floor fespalier_dio claims.
  dio: ^5.7.0
  # dio 5.7.0 allows dio_web_adapter 1.0.0, which calls a `debugLog` that 5.7.0 lacks.
  dio_web_adapter: ">=1.0.1 <3.0.0"
  # retry_test.dart counts the timers a store that throws leaves behind (none).
  fake_async: ^1.3.0
  # Proves the reconnect trigger with the real ConnectivitySignal and FakeConnectivity; lib/ never imports it.
  fespalier_connectivity:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_connectivity
      ref: v0.23.1 # x-release-please-version
  fespalier_dio:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_dio
      ref: v0.23.1 # x-release-please-version
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
