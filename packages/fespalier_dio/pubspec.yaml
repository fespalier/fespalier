name: fespalier_dio
description: Dio for fespalier — Dio as a fespalier_transport transport and a Dio over one, requests cancelled with their page, server validation errors on fespalier_forms forms, and writes that are never retried.
version: 0.25.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_dio
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # 5.7.0: the lowest the floor job can test. The tests run WriteGuard against dio_smart_retry,
  # whose own constraint is `dio: ^5.7.0`, so `flutter pub downgrade` cannot resolve anything
  # lower; a constraint no run exercises is not claimed (the library alone compiles on 5.4.0).
  dio: ^5.7.0
  # Not imported. dio 5.7.0 allows dio_web_adapter 1.0.0, which calls a `debugLog` that 5.7.0 lacks: a web build
  # of an app at its lowest versions does not compile. Depending on it steers every app's resolution to 1.0.1
  # or newer (dio 5.7.0 asks for ^1.0.0, later releases for ^2.1.0).
  dio_web_adapter: ">=1.0.1 <3.0.0"
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.25.1 # x-release-please-version
  # HttpTransport, which DioTransport implements and TransportAdapter takes (since 0.21.0), and the
  # one write rule WriteGuard shares with every transport.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.25.1 # x-release-please-version
  # FetchHttpClientAdapter (lib/fetch.dart, since 0.25.0): fetch, AbortController and the body's
  # ReadableStream, in a web build only. 0.5.0 is where these are extension types, which dart2js
  # and dart2wasm both compile; 1.1.2 asks for Dart 3.13, so the 3.35 floor resolves 1.1.1.
  web: ">=0.5.0 <2.0.0"

dev_dependencies:
  # The tests run the real SessionTransport under the retry interceptor (test/session_retry_test.dart).
  fespalier_auth:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_auth
      ref: v0.25.1 # x-release-please-version
  # The tests run WriteGuard against the retry interceptor apps actually use, with zero delays.
  dio_smart_retry: ^7.0.1
  # The browser harness (test/browser/harness.dart, `just fetch-adapter`) reads an event stream
  # through HttpClientTransport(BrowserClient()) next to the fetch adapter. Never a regular
  # dependency: test/no_http_test.dart checks that the package links no package:http.
  fespalier_http:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_http
      ref: v0.25.1 # x-release-please-version
  # The browser harness reads events with fespalier_stream's wire layer (EventSource), which has
  # no Flutter in it, over both transports.
  fespalier_stream:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_stream
      ref: v0.25.1 # x-release-please-version
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # BrowserClient, for the browser harness only.
  http: ^1.5.0
