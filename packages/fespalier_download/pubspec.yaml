name: fespalier_download
description: "Downloads for fespalier: the request, status and port model of a file transfer that survives the app, with fakes. Pure Dart over package:http."
version: 0.14.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_download
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  clock: ^1.1.1
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.14.0 # x-release-please-version
  # HttpCredentials, which the foreground backend authorizes each send with (since 0.15.0).
  fespalier_http:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_http
      ref: v0.14.0 # x-release-please-version
  # 1.5.0: abortable requests, which the foreground backend aborts a pause or a cancel with.
  http: ^1.5.0
  # The SHA-256 of a finished file (3.0.6 is the first release whose floor is Dart 3.4).
  crypto: ">=3.0.6 <4.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Flutter's own flutter_test pins the version (3.0.9 on Flutter 3.32, the floor), so the constraint
  # must admit that one.
  leak_tracker_flutter_testing: ^3.0.9

# In this repository the package is built against the fespalier beside it. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
  fespalier_http:
    path: ../fespalier_http
