name: fespalier_download_background
description: "Background downloads for fespalier: a DownloadBackend over background_downloader (WorkManager and user-initiated jobs on Android, URLSession on iOS), with the mapping tested without the plugin."
version: 0.20.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_download_background
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  # background_downloader 9.6 needs Dart 3.13 (Flutter 3.47).
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # 9.6.4 is the release this package was written against (its sources were read, not recalled);
  # it asks for Dart 3.13 and Flutter 3.47, which is why this package is outside the floor job.
  background_downloader: ">=9.6.4 <10.0.0"
  clock: ^1.1.1
  # Not imported. background_downloader reaches path_provider, whose Linux and Windows plugins reach file
  # (through xdg_directories and process) and allow file 6.0.0. file before 6.1.3 does not compile on Dart 3.9
  # (`File.create` has no `exclusive:`), and a Linux or Windows build compiles those plugins' Dart code: an
  # app's `flutter pub downgrade` picks 6.0.0 and does not build. Depending on it steers every app's
  # resolution to 6.1.3 or newer.
  file: ">=6.1.3 <8.0.0"
  flutter:
    sdk: flutter
  # The same repository dependencies an app writes (same url, path and ref), so they resolve to
  # one package each: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.20.0 # x-release-please-version
  fespalier_download:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_download
      ref: v0.20.0 # x-release-please-version
  # HttpWrites, the one rule of which request is a write (since 0.15.0, for uploads).
  fespalier_http:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_http
      ref: v0.20.0 # x-release-please-version
  # Not imported. background_downloader reaches path_provider, whose platform interface allows platform 3.0.0,
  # which reads `Platform.packageRoot`, gone from Dart 3: an app's `flutter pub downgrade` picks it and does not
  # compile. Depending on it steers every app's resolution to 3.1.4 or newer.
  platform: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# In this repository the packages are built against the ones beside them. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
  fespalier_download:
    path: ../fespalier_download
  fespalier_http:
    path: ../fespalier_http
