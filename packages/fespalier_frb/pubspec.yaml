name: fespalier_frb
description: "A Rust core's change stream for fespalier: one subscription held by Riverpod, and providers that rebuild exactly when a matching change arrives. No flutter_rust_bridge dependency."
version: 0.25.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_frb
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # Riverpod comes through it. flutter_rust_bridge is not a dependency: see the README.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.25.0 # x-release-please-version
  # ChangeFeed, its topics, ChangeBudget, InvalidationTable and the codec under ChangeCodec live there
  # since 0.25.0, and this package re-exports them. The same url and ref as fespalier, for the same
  # reason; an app that overrides fespalier_frb by path overrides fespalier_stream (and
  # fespalier_transport, which it depends on) too.
  fespalier_stream:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_stream
      ref: v0.25.0 # x-release-please-version

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
