name: fespalier_keypair
description: Device keys that sign — a P-256 key in the Secure Enclave or the AndroidKeyStore (flutter-sign-keypair), in a browser's non-extractable CryptoKey, or in memory; ES256 and JOSE helpers; no auth concept.
version: 0.23.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_keypair
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  # flutter_sign_keypair needs Dart 3.12 (Flutter 3.44).
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # The SHA-256 of a JWK thumbprint (RFC 7638) and of a fake key's scalar.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  # Not on pub.dev (publish_to: none), so a git dependency, pinned to a commit: the one of its
  # v0.1.2. Never a tag here: cli/tests/versions.rs reads every ref that starts with the letter v
  # in this file as fespalier's own version. Bump it deliberately, after reading the diff.
  flutter_sign_keypair:
    git:
      url: https://github.com/vaam-apps/flutter-sign-keypair
      ref: c6a513781a3d11fd453268b0776447a45c679b32
  # verifyEs256: an ES256 signature checked in pure Dart, for a server and a test.
  pointycastle: ^4.0.0
  # The browser's key (WebCryptoKeypairSigner): Web Crypto and IndexedDB through dart:js_interop.
  web: ">=0.4.0 <2.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
