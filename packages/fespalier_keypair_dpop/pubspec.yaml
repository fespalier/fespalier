name: fespalier_keypair_dpop
description: DPoP (RFC 9449) for fespalier_oidc — proofs signed by a device key from fespalier_keypair (Secure Enclave, AndroidKeyStore, or a browser's non-extractable CryptoKey), and verifyDpopProof for a server.
version: 0.25.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_keypair_dpop
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  # fespalier_keypair needs Dart 3.12 (Flutter 3.44): flutter_sign_keypair does.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  clock: ^1.1.1
  # The SHA-256 of `ath`.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  # The same repository dependencies an app writes (same url, path and ref), so they resolve to
  # one package each: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # The key and the signer a proof is made with.
  fespalier_keypair:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_keypair
      ref: v0.25.1 # x-release-please-version
  # ProofOfPossession, which DpopProof implements, and the backend that takes it.
  fespalier_oidc:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_oidc
      ref: v0.25.1 # x-release-please-version
  # parseHttpDate, for the Date header of a clock correction.
  http_parser: ^4.1.0

dev_dependencies:
  # test/dio_retry_test.dart reads a ProviderContainer from it.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.25.1 # x-release-please-version
  # The core the tests build a session on: AuthConfig, SessionTransport, the notifier.
  fespalier_auth:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_auth
      ref: v0.25.1 # x-release-please-version
  # TransportAdapter, which lets test/dio_retry_test.dart's Dio send through a SessionTransport.
  fespalier_dio:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_dio
      ref: v0.25.1 # x-release-please-version
  # FakeTransport and fakeResponse, the HttpTransport the tests answer from.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.25.1 # x-release-please-version
  # For fespalier_dio's TransportAdapter in test/dio_retry_test.dart; fespalier_dio's constraint.
  dio: ^5.7.0
  # The retrier that test runs the real proof under; fespalier_dio's constraint.
  dio_smart_retry: ^7.0.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # test/device_test.dart and the keypair seam: SoftwareKeyStore and SecureSignerException.
  flutter_sign_keypair:
    git:
      url: https://github.com/vaam-apps/flutter-sign-keypair
      ref: c6a513781a3d11fd453268b0776447a45c679b32

# In this repository the packages are built against the ones beside them. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
  fespalier_auth:
    path: ../fespalier_auth
  fespalier_dio:
    path: ../fespalier_dio
  fespalier_keypair:
    path: ../fespalier_keypair
  fespalier_oidc:
    path: ../fespalier_oidc
  fespalier_transport:
    path: ../fespalier_transport
