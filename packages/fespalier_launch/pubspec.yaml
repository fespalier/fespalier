name: fespalier_launch
description: "Shortcut and home-screen widget taps for fespalier: a cold start and a tap while running open typed routes. The plugins (quick_actions, home_widget) are the app's."
version: 0.20.0 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_launch
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # Riverpod and go_router come through it; this package adds no other dependency (no quick_actions,
  # no home_widget: they are recipes, and the app hands the actions to the source).
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.20.0 # x-release-please-version

dev_dependencies:
  # adapter_test.dart counts the timers a source that fails leaves behind (none).
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# In this repository the package is built against the fespalier beside it. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
