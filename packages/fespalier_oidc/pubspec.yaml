name: fespalier_oidc
description: OpenID Connect (PKCE, Keycloak) and bearer-token sessions for fespalier_auth — a token credential, the Bearer authenticator, DPoP's proof-of-possession seam and a browser or password sign-in.
version: 0.21.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_oidc
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # What every expiry check reads the time from, so a test's fake clock ages the tokens.
  clock: ^1.1.1
  # PKCE's S256 challenge.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.21.1 # x-release-please-version
  # AuthBackend, AuthSession, the notifier: what this package is a backend for.
  fespalier_auth:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_auth
      ref: v0.21.1 # x-release-please-version
  # HttpTransport: the only way this package sends a request (the token endpoint, discovery,
  # revocation), so it links neither package:http nor Dio.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.21.1 # x-release-please-version

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
