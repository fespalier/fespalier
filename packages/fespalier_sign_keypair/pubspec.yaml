name: fespalier_sign_keypair
description: Token-free device-signed sessions for fespalier_auth — enrol a device key, then sign every request with it (an attestation plus a per-send signature over the method, path, query and body), and a verifier for tests.
version: 0.24.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_sign_keypair
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  # fespalier_keypair needs Dart 3.12 (Flutter 3.44): flutter_sign_keypair does.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # What every expiry and every `iat` is read from, so a test's fake clock ages the attestations.
  clock: ^1.1.1
  collection: ^1.18.0
  # The SHA-256 of `qsh` and `bdh`.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  # The same repository dependencies an app writes (same url, path and ref), so they resolve to
  # one package each: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # FieldErrors, which the fake server throws for a wrong one-time code.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.24.1 # x-release-please-version
  # The session core this package is a backend for.
  fespalier_auth:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_auth
      ref: v0.24.1 # x-release-please-version
  # The keys and signers a request is signed with.
  fespalier_keypair:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_keypair
      ref: v0.24.1 # x-release-please-version
  # TransportRequest, which the signer signs. Pure Dart: no HTTP client.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.24.1 # x-release-please-version

dev_dependencies:
  # TransportAdapter, which lets the tests' own Dio (and dio_smart_retry) send through a SessionTransport.
  fespalier_dio:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_dio
      ref: v0.24.1 # x-release-please-version
  # HttpClientTransport and TransportClient: package:http code sending through a SessionTransport.
  fespalier_http:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_http
      ref: v0.24.1 # x-release-please-version
  # For fespalier_dio's TransportAdapter; fespalier_dio's constraint.
  dio: ^5.7.0
  # The retrier the tests run the device signature under; fespalier_dio's constraint.
  dio_smart_retry: ^7.0.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # MockClient, the package:http client the tests send through; fespalier_http's constraint.
  http: ^1.5.0

# In this repository the packages are built against the ones beside them. A dependency's
# overrides are ignored, so apps never see this.
dependency_overrides:
  fespalier:
    path: ../fespalier
  fespalier_auth:
    path: ../fespalier_auth
  fespalier_dio:
    path: ../fespalier_dio
  fespalier_http:
    path: ../fespalier_http
  fespalier_keypair:
    path: ../fespalier_keypair
  fespalier_transport:
    path: ../fespalier_transport
