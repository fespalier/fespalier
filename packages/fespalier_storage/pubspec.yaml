name: fespalier_storage
description: "Storages for fespalier's dataCache on shared_preferences and Hive: the saved value on the first frame, with size limits and eviction."
version: 0.22.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_storage
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # The test clock: expiry and write times follow testWidgets' fake clock (fespalier pins the same).
  clock: ^1.1.1
  # SHA-256 of a Hive key longer than 255 UTF-8 bytes (Hive's limit). 3.0.6 is the first release whose
  # floor is Dart 3.4, as fespalier_download says.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.22.1 # x-release-please-version
  # Not imported. shared_preferences_linux and shared_preferences_windows allow file 6.0.0, and
  # path_provider_linux reaches it through xdg_directories and process. file before 6.1.3 does not compile on
  # Dart 3.9 (`File.create` has no `exclusive:`), and a Linux or Windows build compiles those plugins' Dart
  # code: an app's `flutter pub downgrade` picks 6.0.0 and does not build. Depending on it steers every
  # app's resolution to 6.1.3 or newer.
  file: ">=6.1.3 <8.0.0"
  # Pure Dart: no plugin, and no Flutter floor. hive_ce_flutter (Flutter >= 3.44) is not needed.
  hive_ce: ^2.16.0
  # HiveDataStorage.open(): the app's cache directory (getApplicationCacheDirectory, 2.1.0).
  path_provider: ^2.1.0
  # Not imported. path_provider_platform_interface allows platform 3.0.0, which reads
  # `Platform.packageRoot`, gone from Dart 3: an app's `flutter pub downgrade` picks it and does not
  # compile. Depending on it steers every app's resolution to 3.1.4 or newer.
  platform: ^3.1.4
  # SharedPreferencesWithCache (2.3.0): synchronous reads after an async create; 2.5.1 is the first to
  # export SharedPreferencesOptions, which `PrefsDataStorage.open(options:)` takes (CI's `floor` job).
  shared_preferences: ^2.5.1
  # testing.dart: InMemorySharedPreferencesAsync.
  shared_preferences_platform_interface: ^2.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
