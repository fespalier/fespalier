name: fespalier_stream
description: "Server-sent events and WebSockets for fespalier: a WHATWG event-stream decoder over fespalier_transport's HttpTransport, a WebSocket connection whose ticket goes through it, and live feeds held by Riverpod that reconnect on the app's own signals, with no timer of their own."
version: 0.25.1 # x-release-please-version
# Not published to pub.dev: apps depend on it through the repository, next to fespalier (see the README).
publish_to: 'none'
homepage: https://github.com/fespalier/fespalier
repository: https://github.com/fespalier/fespalier/tree/main/packages/fespalier_stream
issue_tracker: https://github.com/fespalier/fespalier/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  # When a connection last heard from its server, read through package:clock so a test moves time.
  clock: ^1.1.1
  flutter:
    sdk: flutter
  # The same repository dependency an app writes (same url, path and ref), so the two resolve to
  # one package: a path dependency would resolve "at <sha>" and conflict with the app's tag.
  # Riverpod, DataRefusal and the telemetry seam come through it.
  fespalier:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier
      ref: v0.25.1 # x-release-please-version
  # HttpTransport, which every connection sends through, so an app's decorators (a session, a
  # signature, a trace) see an event stream like any other request.
  # test/no_http_test.dart checks that neither package:http nor Dio is a dependency.
  fespalier_transport:
    git:
      url: https://github.com/fespalier/fespalier
      path: packages/fespalier_transport
      ref: v0.25.1 # x-release-please-version
  # WebSocketConnector (lib/web_socket.dart, since 0.25.0): dart:io's WebSocket natively, the
  # browser's in a web build, dart2js and wasm alike. Not an HTTP client (no_http_test.dart is
  # unaffected), and only lib/web_socket.dart reaches it (web_socket_library_test.dart).
  # 1.0.1 asks for Dart 3.4 and web 0.5.0, both under the 3.35 floor.
  web_socket: ^1.0.1

dev_dependencies:
  # retry_test.dart counts the timers a feed that fails leaves behind (none), and the idle tests
  # move package:clock's time.
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
